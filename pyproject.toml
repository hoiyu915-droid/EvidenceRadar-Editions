[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceradar-editions"
version = "0.1.0"
description = "Build auditable journal editions directly from primary bibliographic sources."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "hoiyu915-droid"}]
keywords = ["literature surveillance", "bibliography", "PubMed", "Crossref", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "PyYAML>=6.0.2,<7",
  "requests>=2.32.3,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
evidenceradar-editions = "evidenceradar_editions.cli:main"

[project.urls]
Homepage = "https://github.com/hoiyu915-droid/EvidenceRadar-Editions"
Repository = "https://github.com/hoiyu915-droid/EvidenceRadar-Editions"
Issues = "https://github.com/hoiyu915-droid/EvidenceRadar-Editions/issues"
Upstream = "https://github.com/hoiyu915-droid/EvidenceRadar"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
evidenceradar_editions = ["py.typed", "data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
