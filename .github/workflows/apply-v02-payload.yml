name: Apply v0.2 source payload (temporary)

on:
  push:
    branches:
      - feat/editions-v0.2-publication
    paths:
      - ".v02-payload/**"
      - ".github/workflows/apply-v02-payload.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/editions-v0.2-publication
          fetch-depth: 0

      - name: Verify and apply payload
        shell: bash
        run: |
          set -euo pipefail
          cat .v02-payload/part-* | base64 --decode > "$RUNNER_TEMP/v02-source.tar.gz"
          echo "21f97dcf881d77a2b6e9d8f50bbb88ee1e89b311e87652cabd209b12a0448289  $RUNNER_TEMP/v02-source.tar.gz" | sha256sum --check --strict
          python - <<'PY'
          import pathlib, tarfile
          archive = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'v02-source.tar.gz'
          with tarfile.open(archive, 'r:gz') as handle:
              for member in handle.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe payload member: {member.name}')
              handle.extractall('.', filter='data')
          PY
          rm -rf .v02-payload
          rm -f .github/workflows/apply-v02-payload.yml
          rm -f .github/workflows/source-snapshot.yml

      - name: Verify source before commit
        run: |
          python -m pip install -e .
          PYTHONDONTWRITEBYTECODE=1 python -m compileall -q evidenceradar_editions tests
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v

      - name: Commit exact payload scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path('.')
          tracked = []
          with __import__('tarfile').open(pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'v02-source.tar.gz', 'r:gz') as handle:
              for member in handle.getmembers():
                  if not member.isfile():
                      continue
                  value = member.name[2:] if member.name.startswith('./') else member.name
                  if value and value not in {'.github/workflows/source-snapshot.yml'}:
                      tracked.append(value)
          for value in sorted(set(tracked)):
              subprocess.run(['git', 'add', '--', value], check=True)
          for value in (
              '.github/workflows/source-snapshot.yml',
              '.github/workflows/apply-v02-payload.yml',
          ):
              subprocess.run(['git', 'add', '-u', '--', value], check=True)
          subprocess.run(['git', 'add', '-u', '--', '.v02-payload'], check=True)
          PY
          git diff --cached --check
          git commit -m "feat: add v0.2 publication archive and Pages"
          git push origin HEAD:feat/editions-v0.2-publication
