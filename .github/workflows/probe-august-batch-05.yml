name: Probe August 2026 batch 05 journals

on:
  push:
    branches:
      - data/2026-08-batch-05-five-journals
    paths:
      - ".github/workflows/probe-august-batch-05.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Editions
        run: python -m pip install -e .
      - name: Acquire five August MTD editions
        shell: bash
        run: |
          set -euo pipefail
          for slug in \
            computer-speech-and-language \
            computers-and-education-artificial-intelligence \
            computers-in-human-behavior-reports \
            computers-in-human-behavior-artificial-humans \
            information-processing-and-management
          do
            python -m evidenceradar_editions run \
              --journal-slug "$slug" \
              --start 2026-08-01 \
              --end 2026-08-14 \
              --period-kind month \
              --output-dir "probe/$slug"
          done
      - name: Audit and summarize
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          START='2026-08-01'; END='2026-08-14'
          bad_re=re.compile(r'(?i)(editorial board|table of contents|^contents$|temporary removal|withdrawn|membership appl|current events|issue information|front matter|masthead|^cover$|call for papers|editor.?s choice)')
          rows=[]; flags=[]; summary=[]
          for d in sorted(Path('probe').iterdir()):
              if not d.is_dir():
                  continue
              files=[p for p in d.glob('*.json') if not p.name.endswith('.manifest.json') and 'translation-' not in p.name]
              if len(files)!=1:
                  raise SystemExit(f'{d}: expected one edition json, got {files}')
              run=json.loads(files[0].read_text(encoding='utf-8'))
              for a in run.get('articles') or []:
                  date=str(a.get('publication_date') or '')
                  prec=str(a.get('publication_date_precision') or '')
                  date_ok=(prec=='DAY' and START <= date <= END) or (prec=='MONTH' and date.startswith('2026-08'))
                  row={
                    'slug':d.name,
                    'canonical_id':a.get('canonical_id'),
                    'title':a.get('title_original') or a.get('title'),
                    'date':date,
                    'date_precision':prec,
                    'article_type':a.get('article_type'),
                    'doi':a.get('doi'),
                    'pmid':a.get('pmid'),
                    'date_ok':date_ok,
                  }
                  rows.append(row)
                  keyword_flag=bool(bad_re.search(str(row['title'] or '')))
                  if (not date_ok) or keyword_flag:
                      flags.append({**row,'keyword_flag':keyword_flag,'reason':'date_precision_or_front_matter'})
              summary.append({
                'slug':d.name,
                'journal':(run.get('scope') or {}).get('journal'),
                'articles':len(run.get('articles') or []),
                'run_status':run.get('run_status'),
                'source_checks':run.get('source_checks') or [],
              })
          with open('probe/titles.ndjson','w',encoding='utf-8') as f:
              for row in rows:
                  f.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
          Path('probe/flags.json').write_text(json.dumps({'count':len(flags),'items':flags},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('probe/summary.json').write_text(json.dumps({'period':'2026-08','through':'2026-08-14','journals':summary,'total_articles':len(rows),'flag_count':len(flags)},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'articles':len(rows),'flags':len(flags),'journals':summary},ensure_ascii=False,indent=2))
          PY
      - name: Commit probe results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe
          git diff --cached --check
          git commit -m 'probe: acquire August 2026 batch 05'
          git push origin HEAD:data/2026-08-batch-05-five-journals
