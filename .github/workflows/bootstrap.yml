name: Diagnose bootstrap payload

on:
  push:
    branches: [feat/initial-editions-engine]
    paths:
      - .bootstrap/**
      - .github/workflows/bootstrap.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/initial-editions-engine
      - name: Report payload-part lengths and hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          parts = sorted(Path('.bootstrap').glob('part-*.txt'))
          print(f'part_count={len(parts)}')
          assembled = ''
          for path in parts:
              text = path.read_text(encoding='ascii').strip()
              assembled += text
              print(f'{path.name} len={len(text)} sha256={hashlib.sha256(text.encode("ascii")).hexdigest()}')
          print(f'assembled_len={len(assembled)}')
          print(f'assembled_sha256={hashlib.sha256(assembled.encode("ascii")).hexdigest()}')
          PY
