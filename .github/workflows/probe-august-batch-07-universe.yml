name: Probe August 2026 batch 07 journal universe

on:
  push:
    branches:
      - data/2026-08-batch-07-ten-journals
    paths:
      - .github/workflows/probe-august-batch-07-universe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Editions
        run: python -m pip install -e .
      - name: Probe remaining active and planned OA fallbacks
        run: |
          python - <<'PY'
          import json, re
          from datetime import date
          from pathlib import Path
          from evidenceradar_editions.engine import build_run
          from evidenceradar_editions.models import EditionSpec

          registry = json.loads(Path('catalog/journals.json').read_text())
          journals = registry['journals']
          start, end = date(2026,8,1), date(2026,8,14)
          planned_fallbacks = {
              'acs-central-science','chemical-science','national-science-review',
              'physical-review-x','plos-biology','plos-medicine','pnas-nexus',
              'science-advances','scientific-data','journal-of-machine-learning-research',
              'tacl','tmlr'
          }
          front = re.compile(r'^(?:editorial board|editorial office|table of contents|contents|front cover|back cover|call for papers|temporary removal|withdrawn|current events|preface(?:\s+to)?|.*membership applic|.*award(?:\s|$))', re.I)
          rows=[]
          for j in journals:
              slug=j['slug']
              active = j.get('status') == 'active' and j.get('enabled', True) is not False
              planned = slug in planned_fallbacks
              if not (active or planned):
                  continue
              if Path('editions',slug,'2026','08').exists():
                  continue
              sources = tuple(j.get('sources') or ['crossref']) if active else ('crossref',)
              try:
                  spec=EditionSpec(journal=j['name'], issn=j.get('issn'), slug=slug, start_date=start, end_date=end, sources=sources, max_records=5000, period_kind='month')
                  ed=build_run(spec)
                  flags=[]
                  derived_issns=set()
                  for a in ed['articles']:
                      derived_issns.update(a.get('issns') or [])
                      reason=[]
                      if a.get('publication_date_precision') == 'YEAR': reason.append('YEAR')
                      if front.search((a.get('title') or '').strip()): reason.append('FRONT_MATTER')
                      if reason:
                          flags.append({'canonical_id':a['canonical_id'],'title':a['title'],'date':a['publication_date'],'precision':a['publication_date_precision'],'reason':reason})
                  rows.append({
                      'slug':slug,'journal':j['name'],'registry_status':j.get('status'),
                      'probe_mode':'registry_sources' if active else 'planned_crossref_only',
                      'issn':j.get('issn'),'derived_issns':sorted(derived_issns),
                      'articles':ed['counts']['articles'],'flag_count':len(flags),
                      'rough_keepable':ed['counts']['articles']-len(flags),
                      'run_status':ed['run_status'],'source_checks':ed['source_checks'],
                      'flags':flags[:40],
                  })
              except Exception as exc:
                  rows.append({'slug':slug,'journal':j['name'],'registry_status':j.get('status'),'error':f'{type(exc).__name__}: {exc}'})
          rows.sort(key=lambda r:(r.get('registry_status')!='active', r.get('rough_keepable',0), r['slug']))
          out={'period':'2026-08','through':'2026-08-14','candidate_count':len(rows),'candidates':rows}
          Path('probe').mkdir(exist_ok=True)
          Path('probe/batch07-universe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps([{k:r.get(k) for k in ('slug','registry_status','articles','flag_count','rough_keepable','run_status','error')} for r in rows],ensure_ascii=False,indent=2))
          PY
      - name: Commit probe summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe/batch07-universe.json
          git commit -m 'probe: summarize batch 07 journal universe'
          git push
