name: Acquire August 2026 MTD batch 01

on:
  push:
    branches:
      - batch/2026-08-mtd-01
    paths:
      - ".github/workflows/batch-2026-08-mtd-01.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Editions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Acquire five journals from local registry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for slug in \
            the-lancet-digital-health \
            the-lancet-healthy-longevity \
            journal-of-science-and-medicine-in-sport \
            journal-of-sport-and-health-science \
            clinical-nutrition
          do
            mkdir -p "dist/$slug"
            python -m evidenceradar_editions run \
              --journal-slug "$slug" \
              --start 2026-08-01 \
              --end 2026-08-14 \
              --period-kind month \
              --revision 1 \
              --max-records 500 \
              --output-dir "dist/$slug" \
              --translation-request "dist/$slug/translation-request.zh-TW.json"
            python -m evidenceradar_editions validate --bundle-dir "dist/$slug"
          done

      - name: Summarize acquisition
        shell: python
        run: |
          import json
          from pathlib import Path
          total = 0
          for root in sorted(Path('dist').iterdir()):
              files = [p for p in root.glob('*.json') if 'manifest' not in p.name and 'translation-request' not in p.name]
              if len(files) != 1:
                  raise SystemExit(f'{root}: expected exactly one edition JSON, got {len(files)}')
              data = json.loads(files[0].read_text(encoding='utf-8'))
              count = int((data.get('counts') or {}).get('articles') or 0)
              total += count
              print(json.dumps({
                  'slug': root.name,
                  'journal': (data.get('scope') or {}).get('journal'),
                  'articles': count,
                  'run_status': data.get('run_status'),
                  'sources': [
                      {'source': c.get('source'), 'status': c.get('status'), 'accepted': c.get('accepted_count')}
                      for c in (data.get('source_checks') or [])
                  ],
              }, ensure_ascii=False))
          print(json.dumps({'batch_articles': total}, ensure_ascii=False))

      - name: Upload acquisition and translation requests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: august-2026-mtd-batch-01-acquisition
          path: dist/
          if-no-files-found: error
          retention-days: 7
