name: Publish metadata-triaged Editions portal

on:
  workflow_run:
    workflows: ["Publish EvidenceRadar Editions portal"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-metadata-triage
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout triggering main commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Checkout main for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Build metadata-triaged portal from canonical editions
        run: |
          rm -rf "$RUNNER_TEMP/triage-site"
          python -m evidenceradar_editions.triage_delivery \
            --editions-root editions \
            --catalog-root catalog \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$RUNNER_TEMP/triage-site"

      - name: Validate delivery contract
        run: |
          SITE="$RUNNER_TEMP/triage-site"
          test -s "$SITE/index.html"
          test -s "$SITE/index.json"
          test -s "$SITE/search-index.json"
          test -s "$SITE/metadata-triage.json"
          test -s "$SITE/metadata-triage-policy.json"
          test -s "$SITE/metadata-triage/index.html"
          test -s "$SITE/links.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path(os.environ["RUNNER_TEMP"]) / "triage-site"
          triage = json.loads((site / "metadata-triage.json").read_text())
          search = json.loads((site / "search-index.json").read_text())
          links = json.loads((site / "links.json").read_text())
          assert triage["artifact_type"] == "EvidenceRadar_Editions_MetadataTriageIndex"
          assert triage["canonical_article_count"] == len(triage["articles"])
          assert search["projected_article_count"] == len(search["articles"])
          assert search["canonical_article_count"] == triage["canonical_article_count"]
          assert search["omitted_article_count"] == (
              search["canonical_article_count"] - search["projected_article_count"]
          )
          assert links["metadata_triage_summary"]["canonical_article_count"] == triage["canonical_article_count"]
          assert links["search_projection"]["metadata_triage_policy_id"] == triage["policy_id"]
          assert all(
              (article.get("metadata_triage") or {}).get("basis")
              == "TITLE_AND_BIBLIOGRAPHIC_METADATA"
              for article in triage["articles"]
          )
          print(json.dumps({
              "canonical": triage["canonical_article_count"],
              "priority": triage["priority_candidate_count"],
              "projected": search["projected_article_count"],
              "omitted": search["omitted_article_count"],
              "tiers": triage["canonical_triage_counts"]["by_tier"],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Write delivery summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          site = Path(os.environ["RUNNER_TEMP"]) / "triage-site"
          value = json.loads((site / "metadata-triage.json").read_text())
          tiers = value["canonical_triage_counts"]["by_tier"]
          print("## Metadata triage delivery")
          print()
          print(f"- canonical records triaged: `{value['canonical_article_count']}`")
          print(f"- ALERT + HIGH candidates: `{value['priority_candidate_count']}`")
          print(f"- default projected records: `{value['default_projected_article_count']}`")
          print(f"- omitted only from default payload: `{value['default_omitted_article_count']}`")
          print(f"- ALERT: `{tiers.get('ALERT', 0)}`")
          print(f"- HIGH: `{tiers.get('HIGH', 0)}`")
          print(f"- MEDIUM: `{tiers.get('MEDIUM', 0)}`")
          print(f"- LOW: `{tiers.get('LOW', 0)}`")
          print("- scientific semantics: `metadata priority only; no evidence-quality claim`")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload triaged Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/triage-site

      - name: Deploy triaged portal
        id: deployment
        uses: actions/deploy-pages@v4
