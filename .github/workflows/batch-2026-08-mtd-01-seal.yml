name: Seal August 2026 MTD batch 01

on:
  push:
    branches:
      - batch/2026-08-mtd-01
    paths:
      - ".github/workflows/batch-2026-08-mtd-01-seal.yml"

permissions:
  actions: read
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Download acquisition artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p staging/acq/main staging/acq/replacement
          gh run download 31761847161 \
            --repo "$GITHUB_REPOSITORY" \
            --name august-2026-mtd-batch-01-acquisition \
            --dir staging/acq/main
          gh run download 31761901934 \
            --repo "$GITHUB_REPOSITORY" \
            --name august-2026-mtd-batch-01-replacement \
            --dir staging/acq/replacement
          find staging/acq -maxdepth 2 -type d -print | sort

      - name: Translate, validate, seal, and rebuild Pages
        run: python tools/seal_batch01.py

      - name: Commit canonical publications only
        shell: bash
        run: |
          set -euo pipefail
          if find editions -type f -name '*.html' -print -quit | grep -q .; then
            echo '::error::HTML leaked into canonical editions storage'
            exit 1
          fi

          rm -rf staging
          rm -f \
            .github/workflows/batch-2026-08-mtd-01.yml \
            .github/workflows/batch-2026-08-mtd-01-replacement.yml \
            .github/workflows/batch-2026-08-mtd-01-seal.yml \
            tools/seal_batch01.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- \
            editions/the-lancet-digital-health/2026/08/r01 \
            editions/the-lancet-healthy-longevity/2026/08/r01 \
            editions/journal-of-science-and-medicine-in-sport/2026/08/r01 \
            editions/clinical-nutrition/2026/08/r01 \
            editions/journal-of-exercise-science-and-fitness/2026/08/r01
          git add -u -- \
            .github/workflows/batch-2026-08-mtd-01.yml \
            .github/workflows/batch-2026-08-mtd-01-replacement.yml \
            .github/workflows/batch-2026-08-mtd-01-seal.yml \
            tools/seal_batch01.py \
            staging/batch01

          git diff --cached --check
          echo '--- staged files ---'
          git diff --cached --name-status

          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            editions/clinical-nutrition/2026/08/r01/edition.json \
            editions/clinical-nutrition/2026/08/r01/manifest.json \
            editions/clinical-nutrition/2026/08/r01/storage.json \
            editions/journal-of-exercise-science-and-fitness/2026/08/r01/edition.json \
            editions/journal-of-exercise-science-and-fitness/2026/08/r01/manifest.json \
            editions/journal-of-exercise-science-and-fitness/2026/08/r01/storage.json \
            editions/journal-of-science-and-medicine-in-sport/2026/08/r01/edition.json \
            editions/journal-of-science-and-medicine-in-sport/2026/08/r01/manifest.json \
            editions/journal-of-science-and-medicine-in-sport/2026/08/r01/storage.json \
            editions/the-lancet-digital-health/2026/08/r01/edition.json \
            editions/the-lancet-digital-health/2026/08/r01/manifest.json \
            editions/the-lancet-digital-health/2026/08/r01/storage.json \
            editions/the-lancet-healthy-longevity/2026/08/r01/edition.json \
            editions/the-lancet-healthy-longevity/2026/08/r01/manifest.json \
            editions/the-lancet-healthy-longevity/2026/08/r01/storage.json | sort)"
          if [ "$actual" != "$expected" ]; then
            echo '::error::Final staged diff is not exactly the 15 canonical publication files'
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

          git commit -m 'data: publish August 2026 MTD batch 01'
          git push origin HEAD:batch/2026-08-mtd-01
