name: Seal August 2026 MTD canonical editions

on:
  push:
    branches:
      - data/2026-08-mtd-publications
    paths:
      - ".github/workflows/seal-august-mtd.yml"

permissions:
  contents: write

concurrency:
  group: seal-august-2026-mtd
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install current Editions engine
        run: python -m pip install -e .
      - name: Acquire, translate, validate, and seal five August MTD editions
        run: python tools/publish_august_mtd.py
      - name: Enforce canonical-tree policy and commit only sealed data
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/seal-august-mtd.yml tools/publish_august_mtd.py
          rm -rf staging
          if find editions -type f -name '*.html' -print -quit | grep -q .; then
            echo '::error::HTML leaked into canonical editions storage'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'data: publish August 2026 MTD editions'
          git push origin HEAD:data/2026-08-mtd-publications
