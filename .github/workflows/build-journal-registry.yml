name: Build journal registry once

on:
  push:
    branches: [feat/catalog-ui-registry-v1]
    paths:
      - ".github/workflows/build-journal-registry.yml"
      - "tools/build_journal_registry.py"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Generate local registry
        run: python tools/build_journal_registry.py
      - name: Validate code, registry and Pages
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q evidenceradar_editions tests tools/build_journal_registry.py
          python -m unittest discover -s tests -v
          python -m evidenceradar_editions journals --catalog-root catalog --enabled-only > "$RUNNER_TEMP/journals.json"
          python - "$RUNNER_TEMP/journals.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['journal_count'] == 46, data['journal_count']
          PY
          rm -rf "$RUNNER_TEMP/site"
          python -m evidenceradar_editions build-pages \
            --editions-root editions \
            --catalog-root catalog \
            --repository "$GITHUB_REPOSITORY" \
            --base-url "https://hoiyu915-droid.github.io/EvidenceRadar-Editions/" \
            --output-dir "$RUNNER_TEMP/site"
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/journals.json"
          grep -q 'id="journal-category"' "$RUNNER_TEMP/site/index.html"
          grep -q 'id="journal-publisher"' "$RUNNER_TEMP/site/index.html"
          grep -q 'A–Z' "$RUNNER_TEMP/site/index.html"
      - name: Commit generated registry and remove one-shot generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog/journals.json
          git rm -- .github/workflows/build-journal-registry.yml tools/build_journal_registry.py
          git diff --cached --check
          git commit -m 'catalog: publish local journal registry'
          git push origin HEAD:feat/catalog-ui-registry-v1
