name: Seal August 2026 batch 03 canonical editions

on:
  push:
    branches:
      - data/2026-08-batch-03-five-journals
    paths:
      - ".github/workflows/seal-august-batch-03.yml"

permissions:
  contents: write

concurrency:
  group: seal-august-2026-batch-03
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install current Editions engine
        run: python -m pip install -e .
      - name: Seal five validated August MTD editions
        run: python tools/seal_august_batch03.py
      - name: Commit canonical data only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -r --ignore-unmatch -- probe translation-work
          git rm --ignore-unmatch -- \
            .github/workflows/probe-august-batch-03.yml \
            .github/workflows/seal-august-batch-03.yml \
            tools/seal_august_batch03.py

          git add -- \
            editions/artificial-intelligence-in-medicine/2026/08/r01 \
            editions/gait-and-posture/2026/08/r01 \
            editions/human-movement-science/2026/08/r01 \
            editions/journal-of-clinical-epidemiology/2026/08/r01 \
            editions/physical-therapy-in-sport/2026/08/r01

          if find editions -type f \( -name '*.html' -o -name '*.zip' \) -print -quit | grep -q .; then
            echo '::error::presentation artifact leaked into canonical editions tree'
            exit 1
          fi

          git diff --cached --check
          changed=$(git diff --cached --name-only --diff-filter=ACMR || true)
          bad=$(printf '%s\n' "$changed" | grep -Ev '^editions/(artificial-intelligence-in-medicine|gait-and-posture|human-movement-science|journal-of-clinical-epidemiology|physical-therapy-in-sport)/2026/08/r01/(edition|manifest|storage)\.json$' || true)
          if [ -n "$bad" ]; then
            echo '::error::unexpected non-deletion paths are staged'
            printf '%s\n' "$bad"
            exit 1
          fi
          canonical_count=$(printf '%s\n' "$changed" | grep -Ec '^editions/(artificial-intelligence-in-medicine|gait-and-posture|human-movement-science|journal-of-clinical-epidemiology|physical-therapy-in-sport)/2026/08/r01/(edition|manifest|storage)\.json$' || true)
          if [ "$canonical_count" != "15" ]; then
            echo "::error::expected exactly 15 canonical target paths, got $canonical_count"
            git status --short
            exit 1
          fi

          git status --short
          git commit -m 'data: publish August 2026 batch 03 editions'
          git push origin HEAD:data/2026-08-batch-03-five-journals
