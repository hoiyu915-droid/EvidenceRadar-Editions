name: Probe August 2026 batch 05 replacement

on:
  push:
    branches:
      - data/2026-08-batch-05-five-journals
    paths:
      - ".github/workflows/probe-august-batch-05-replacement.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Editions
        run: python -m pip install -e .
      - name: Acquire replacement journal
        run: |
          python -m evidenceradar_editions run \
            --journal-slug international-journal-of-human-computer-studies \
            --start 2026-08-01 \
            --end 2026-08-14 \
            --period-kind month \
            --output-dir probe/international-journal-of-human-computer-studies
      - name: Audit replacement
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          d=Path('probe/international-journal-of-human-computer-studies')
          files=[p for p in d.glob('*.json') if not p.name.endswith('.manifest.json') and 'translation-' not in p.name]
          if len(files)!=1: raise SystemExit(files)
          run=json.loads(files[0].read_text(encoding='utf-8'))
          bad_re=re.compile(r'(?i)(editorial board|table of contents|^contents$|temporary removal|withdrawn|membership appl|current events|issue information|front matter|masthead|^cover$|call for papers|editor.?s choice)')
          rows=[]; flags=[]
          for a in run.get('articles') or []:
              date=str(a.get('publication_date') or '')
              prec=str(a.get('publication_date_precision') or '')
              ok=(prec=='DAY' and '2026-08-01'<=date<='2026-08-14') or (prec=='MONTH' and date.startswith('2026-08'))
              row={'slug':d.name,'canonical_id':a.get('canonical_id'),'title':a.get('title_original') or a.get('title'),'date':date,'date_precision':prec,'article_type':a.get('article_type'),'doi':a.get('doi'),'pmid':a.get('pmid'),'date_ok':ok}
              rows.append(row)
              k=bool(bad_re.search(str(row['title'] or '')))
              if (not ok) or k: flags.append({**row,'keyword_flag':k})
          Path('probe/replacement-summary.json').write_text(json.dumps({'slug':d.name,'journal':(run.get('scope') or {}).get('journal'),'articles':len(rows),'run_status':run.get('run_status'),'source_checks':run.get('source_checks') or [],'flags':flags},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(Path('probe/replacement-summary.json').read_text())
          PY
      - name: Commit replacement probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe/international-journal-of-human-computer-studies probe/replacement-summary.json
          git diff --cached --check
          git commit -m 'probe: acquire August 2026 batch 05 replacement'
          git push origin HEAD:data/2026-08-batch-05-five-journals
