name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q evidenceradar_editions tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Empty Pages build smoke
        run: |
          rm -rf "$RUNNER_TEMP/empty-archive" "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/empty-archive"
          python -m evidenceradar_editions build-pages \
            --archive-root "$RUNNER_TEMP/empty-archive" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$RUNNER_TEMP/site"
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/index.json"
      - name: CLI smoke
        run: python -m evidenceradar_editions --help
