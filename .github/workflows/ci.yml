name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Cambridge provider snapshot bootstrap
        if: matrix.python-version == '3.12'
        run: |
          python scripts/refresh_cambridge_provider_catalog.py --output "$RUNNER_TEMP/cambridge.json"
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'cambridge.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('journal_count') != 200 or len(payload.get('journals') or []) != 200:
              raise SystemExit(f"expected reconciled Cambridge OA catalog count 200, got {payload.get('journal_count')}")
          encoded = base64.b64encode(path.read_bytes()).decode('ascii')
          print('CAMBRIDGE_PROVIDER_SNAPSHOT_B64_BEGIN')
          for offset in range(0, len(encoded), 4000):
              print(encoded[offset:offset + 4000])
          print('CAMBRIDGE_PROVIDER_SNAPSHOT_B64_END')
          PY
      - name: Compile
        run: python -m compileall -q evidenceradar_editions tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Empty Pages build smoke
        run: |
          rm -rf "$RUNNER_TEMP/empty-editions" "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/empty-editions"
          python -m evidenceradar_editions build-pages \
            --editions-root "$RUNNER_TEMP/empty-editions" \
            --catalog-root catalog \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$RUNNER_TEMP/site"
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/index.json"
      - name: CLI smoke
        run: python -m evidenceradar_editions --help
