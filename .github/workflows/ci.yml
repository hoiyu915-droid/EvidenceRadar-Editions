name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Cambridge provider snapshot bootstrap
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import base64
          import json
          import re
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          from evidenceradar_editions.adapters import CambridgeCoreAdapter
          from evidenceradar_editions.adapters.cambridge_core import OA_JOURNAL_LISTING, OA_JOURNAL_LISTING_PARAMS
          from evidenceradar_editions.http import HttpClient

          class AnchorInspector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.current = None
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag.casefold() != 'a':
                      return
                  values = dict(attrs)
                  href = values.get('href') or ''
                  if re.fullmatch(r'/core/journals/[a-z0-9-]+/?', urlsplit(href).path, re.I):
                      self.current = [href, values, []]
              def handle_data(self, data):
                  if self.current is not None and data.strip():
                      self.current[2].append(data.strip())
              def handle_endtag(self, tag):
                  if tag.casefold() == 'a' and self.current is not None:
                      self.items.append({
                          'href': self.current[0],
                          'attrs': self.current[1],
                          'text': ' '.join(self.current[2]),
                      })
                      self.current = None

          client = HttpClient()
          params = dict(OA_JOURNAL_LISTING_PARAMS)
          params['pageNum'] = 1
          first_page = client.get_bytes(OA_JOURNAL_LISTING, params=params)
          inspector = AnchorInspector()
          inspector.feed(first_page.decode('utf-8', errors='replace'))
          inspector.close()
          print('CAMBRIDGE_JOURNAL_ANCHORS_PAGE1_BEGIN')
          print(json.dumps(inspector.items, ensure_ascii=False, indent=2))
          print('CAMBRIDGE_JOURNAL_ANCHORS_PAGE1_END')

          journals = CambridgeCoreAdapter(client).list_journals()
          payload = {
              "artifact_type": "EvidenceRadar_Editions_ProviderCatalog",
              "schema_version": "1.0",
              "provider": "cambridge",
              "publisher": "Cambridge University Press",
              "scope": "fully_open_access_journals",
              "source_url": OA_JOURNAL_LISTING,
              "observed_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              "journal_count": len(journals),
              "journals": journals,
          }
          if len(journals) != 200:
              raise SystemExit(f"expected current Cambridge OA catalog count 200, got {len(journals)}")
          raw = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          encoded = base64.b64encode(raw).decode("ascii")
          print("CAMBRIDGE_PROVIDER_SNAPSHOT_B64_BEGIN")
          for offset in range(0, len(encoded), 4000):
              print(encoded[offset:offset + 4000])
          print("CAMBRIDGE_PROVIDER_SNAPSHOT_B64_END")
          PY
      - name: Compile
        run: python -m compileall -q evidenceradar_editions tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Empty Pages build smoke
        run: |
          rm -rf "$RUNNER_TEMP/empty-editions" "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/empty-editions"
          python -m evidenceradar_editions build-pages \
            --editions-root "$RUNNER_TEMP/empty-editions" \
            --catalog-root catalog \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$RUNNER_TEMP/site"
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/index.json"
      - name: CLI smoke
        run: python -m evidenceradar_editions --help
