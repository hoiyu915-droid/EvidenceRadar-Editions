name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Cambridge provider snapshot bootstrap
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          import re
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          from evidenceradar_editions.adapters.cambridge_core import OA_JOURNAL_LISTING, OA_JOURNAL_LISTING_PARAMS
          from evidenceradar_editions.http import HttpClient

          class AnchorInspector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.current = None
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag.casefold() != 'a':
                      return
                  values = dict(attrs)
                  href = values.get('href') or ''
                  if re.fullmatch(r'/core/journals/[a-z0-9-]+/?', urlsplit(href).path, re.I):
                      self.current = [href, values, []]
              def handle_data(self, data):
                  if self.current is not None and data.strip():
                      self.current[2].append(data.strip())
              def handle_endtag(self, tag):
                  if tag.casefold() == 'a' and self.current is not None:
                      self.items.append({
                          'href': self.current[0],
                          'attrs': self.current[1],
                          'text': ' '.join(self.current[2]),
                      })
                      self.current = None

          client = HttpClient()
          all_items = []
          print('CAMBRIDGE_PAGE_ANCHOR_COUNTS_BEGIN')
          for page in range(1, 11):
              params = dict(OA_JOURNAL_LISTING_PARAMS)
              params['pageNum'] = page
              raw = client.get_bytes(OA_JOURNAL_LISTING, params=params)
              parser = AnchorInspector()
              parser.feed(raw.decode('utf-8', errors='replace'))
              parser.close()
              print(f'PAGE {page}: {len(parser.items)}')
              all_items.extend((page, item) for item in parser.items)
              if len(parser.items) != 20:
                  print(f'CAMBRIDGE_ANOMALOUS_PAGE_{page}_BEGIN')
                  print(json.dumps(parser.items, ensure_ascii=False, indent=2))
                  print(f'CAMBRIDGE_ANOMALOUS_PAGE_{page}_END')
          print('CAMBRIDGE_PAGE_ANCHOR_COUNTS_END')
          print('CAMBRIDGE_DISTINCT_CLASSES_BEGIN')
          classes = sorted({str(item['attrs'].get('class') or '') for _, item in all_items})
          print(json.dumps(classes, ensure_ascii=False))
          print('CAMBRIDGE_DISTINCT_CLASSES_END')
          raise SystemExit('diagnostic complete')
          PY
      - name: Compile
        run: python -m compileall -q evidenceradar_editions tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Empty Pages build smoke
        run: |
          rm -rf "$RUNNER_TEMP/empty-editions" "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/empty-editions"
          python -m evidenceradar_editions build-pages \
            --editions-root "$RUNNER_TEMP/empty-editions" \
            --catalog-root catalog \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$RUNNER_TEMP/site"
          test -s "$RUNNER_TEMP/site/index.html"
          test -s "$RUNNER_TEMP/site/index.json"
      - name: CLI smoke
        run: python -m evidenceradar_editions --help
