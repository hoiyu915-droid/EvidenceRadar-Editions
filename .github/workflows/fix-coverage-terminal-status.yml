name: Repair August terminal coverage status
on:
  push:
    branches: [data/2026-08-finish-remaining]
    paths: [.github/workflows/fix-coverage-terminal-status.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Correct terminal coverage and validate full site
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path('catalog/coverage/2026-08.json')
          data=json.loads(p.read_text())
          rows=data['journals']
          matches=[x for x in rows if x.get('slug')=='information-processing-and-management']
          assert len(matches)==1
          row=matches[0]
          assert row['article_count']==0
          row['coverage_status']='NO_MATCHING_ARTICLES'
          row['note']='Exact ISSN Crossref publication-date reconstruction returned zero articles for 2026-08-01..14.'
          counts=Counter(x['coverage_status'] for x in rows)
          data['status_counts']=dict(sorted(counts.items()))
          assert data['processed_journal_count']==58
          assert data['published_journal_count']==51
          assert data['no_edition_count']==7
          assert data['status_counts']=={'DATE_EVIDENCE_INSUFFICIENT':1,'NO_MATCHING_ARTICLES':4,'OUTSIDE_WINDOW':2,'PUBLISHED':51},data['status_counts']
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status_counts':data['status_counts'],'ipm':row},ensure_ascii=False,indent=2))
          PY
          python -m compileall -q evidenceradar_editions tests
          python -m unittest discover -s tests -v
          rm -rf /tmp/coverage-site
          python -m evidenceradar_editions build-pages --editions-root editions --catalog-root catalog --repository hoiyu915-droid/EvidenceRadar-Editions --output-dir /tmp/coverage-site
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/coverage-site')
          coverage=json.loads((root/'coverage/2026-08.json').read_text())
          index=json.loads((root/'index.json').read_text())
          search=json.loads((root/'search-index.json').read_text())
          assert coverage['processed_journal_count']==58
          assert coverage['published_journal_count']==51
          assert coverage['status_counts']=={'DATE_EVIDENCE_INSUFFICIENT':1,'NO_MATCHING_ARTICLES':4,'OUTSIDE_WINDOW':2,'PUBLISHED':51}
          assert index['journal_count']==51
          assert search['article_count']==4321,search['article_count']
          assert json.loads((root/'journals/tmlr/2026-08/r01/browse.json').read_text())['article_count']==84
          print(json.dumps({'published_journals':index['journal_count'],'search_articles':search['article_count'],'tmlr':84},indent=2))
          PY
      - name: Commit formal correction and remove workflow
        run: |
          rm -f .github/workflows/fix-coverage-terminal-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- catalog/coverage/2026-08.json .github/workflows/fix-coverage-terminal-status.yml
          git commit -m 'fix: correct August terminal coverage classification'
          git pull --rebase origin data/2026-08-finish-remaining
          git push
