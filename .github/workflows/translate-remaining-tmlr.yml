name: Translate remaining TMLR August 2026 edition
on:
  push:
    branches: [data/2026-08-finish-remaining]
    paths: [.github/workflows/translate-remaining-tmlr.yml]
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Translate official TMLR candidates
        run: |
          python - <<'PY'
          import concurrent.futures,html,json,random,re,threading,time,urllib.parse,urllib.request
          from pathlib import Path
          src=json.loads(Path('probe/final-first-party.json').read_text())['tmlr']['items']
          assert len(src)==84
          lock=threading.Lock();counter=[0];cjk=re.compile(r'[\u3400-\u9fff]')
          def one(x):
            params={'client':'gtx','sl':'en','tl':'zh-TW','dt':'t','q':x['title']};url='https://translate.googleapis.com/translate_a/single?'+urllib.parse.urlencode(params);last=None
            for attempt in range(8):
              try:
                time.sleep(random.random()*.12 if not attempt else min(12,1.4**attempt)+random.random())
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (EvidenceRadar Editions)'})
                with urllib.request.urlopen(req,timeout=25) as r:data=json.loads(r.read().decode())
                text=html.unescape(''.join(p[0] for p in data[0] if p and p[0]).strip())
                if text and cjk.search(text):break
              except Exception as e:last=e
            else:raise RuntimeError(f"{x.get('openreview_id')}: translation failed {last}")
            with lock:
              counter[0]+=1
              if counter[0]%20==0 or counter[0]==len(src):print('translated',counter[0],len(src),flush=True)
            return {**x,'canonical_id':'openreview:'+str(x['openreview_id']),'title_original':x['title'],'title_zh_tw':text}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex: rows=list(ex.map(one,src))
          assert len(rows)==84 and len({x['canonical_id'] for x in rows})==84
          flags=[x for x in rows if not cjk.search(x['title_zh_tw']) or x['title_zh_tw'].casefold()==x['title_original'].casefold()]
          out={'artifact_type':'EvidenceRadar_Editions_TranslationCandidateLedger','language':'zh-TW','engine':'translate.googleapis.com public zh-TW endpoint','item_count':len(rows),'quality_flag_count':len(flags),'items':rows}
          root=Path('translation-work/remaining');root.mkdir(parents=True,exist_ok=True);(root/'tmlr.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n');(root/'tmlr-flags.json').write_text(json.dumps({'items':flags},ensure_ascii=False,indent=2)+'\n')
          sample=[rows[i] for i in sorted(set([0,len(rows)//2,len(rows)-1,*range(0,len(rows),11)]))];(root/'tmlr-sample.json').write_text(json.dumps({'items':sample},ensure_ascii=False,indent=2)+'\n')
          print('complete',len(rows),'flags',len(flags),'sample',len(sample))
          PY
      - name: Commit translation workspace
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- translation-work/remaining/tmlr.json translation-work/remaining/tmlr-flags.json translation-work/remaining/tmlr-sample.json
          git commit -m 'translation: complete remaining TMLR August titles'
          git pull --rebase origin data/2026-08-finish-remaining
          git push
