name: Seal August 2026 batch 07 canonical editions

on:
  push:
    branches: [data/2026-08-batch-07-ten-journals]
    paths: [.github/workflows/seal-august-batch-07.yml]

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install current Editions engine
        run: python -m pip install -e .
      - name: Seal ten validated August MTD editions
        run: python tools/seal_august_batch07.py
      - name: Commit canonical data and registry only
        run: |
          rm -rf probe translation-work tools/seal_august_batch07.py
          rm -f \
            .github/workflows/probe-august-batch-07-universe.yml \
            .github/workflows/rank-august-batch-07.yml \
            .github/workflows/acquire-august-batch-07-selected.yml \
            .github/workflows/extract-august-batch-07-titles.yml \
            .github/workflows/seal-august-batch-07.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: publish August 2026 batch 07 ten-journal editions'
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 31
          test "$(printf '%s\n' "${files[@]}" | grep -Ec '^editions/[^/]+/2026/08/r01/(edition|manifest|storage)\.json$')" -eq 30
          test "$(printf '%s\n' "${files[@]}" | grep -Ec '^catalog/journals\.json$')" -eq 1
          test "$(printf '%s\n' "${files[@]}" | grep -Evc '^(editions/[^/]+/2026/08/r01/(edition|manifest|storage)\.json|catalog/journals\.json)$')" -eq 0
          if find editions -type f \( -name '*.html' -o -name '*.zip' \) -print -quit | grep -q .; then
            echo 'generated HTML/ZIP leaked into canonical store' >&2
            exit 1
          fi
          git push
