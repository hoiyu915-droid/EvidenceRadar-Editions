name: Cambridge provider snapshot bootstrap

on:
  push:
    branches: [feat/cambridge-provider-pages]

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/cambridge-provider-pages
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Fetch Cambridge provider catalog
        run: |
          python scripts/refresh_cambridge_provider_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('catalog/providers/cambridge.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('journal_count') != 200 or len(payload.get('journals') or []) != 200:
              raise SystemExit(f"expected reconciled Cambridge OA catalog count 200, got {payload.get('journal_count')}")
          PY
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- catalog/providers/cambridge.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Cambridge provider catalog"
          git push origin HEAD:feat/cambridge-provider-pages
