name: Extract August 2026 batch 04 translation work

on:
  push:
    branches:
      - data/2026-08-batch-04-five-journals
    paths:
      - ".github/workflows/extract-august-batch-04-titles.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Build translation work chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path

          nav_re=re.compile(r"(?i)^(editorial board|table of contents|contents|cover|cover image|masthead|issue information|front matter|editors[’']? choice(?: .*)?|current events|membership appl(?:ication)?(?: form)?|temporary removal|withdrawn)$")
          rows=[]
          for line in Path('probe/titles.ndjson').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              row=json.loads(line)
              title=str(row.get('title') or '').strip()
              if not row.get('date_ok'):
                  continue
              if nav_re.fullmatch(title):
                  continue
              rows.append({'canonical_id':row['canonical_id'],'title':title,'slug':row['slug']})

          if len(rows)!=210:
              raise SystemExit(f'expected 210 publishable titles after gate, got {len(rows)}')
          ids=[r['canonical_id'] for r in rows]
          if len(ids)!=len(set(ids)):
              raise SystemExit('duplicate canonical IDs in translation work')

          out=Path('translation-work'); out.mkdir(exist_ok=True)
          for p in out.glob('batch04.part*.ndjson'):
              p.unlink()
          size=20
          for i in range(0,len(rows),size):
              part=rows[i:i+size]
              path=out/f'batch04.part{i//size+1:02d}.ndjson'
              with path.open('w',encoding='utf-8') as f:
                  for row in part:
                      f.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
          Path('translation-work/manifest.json').write_text(json.dumps({'expected_items':len(rows),'parts':(len(rows)+size-1)//size},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'prepared {len(rows)} titles in {(len(rows)+size-1)//size} parts')
          PY
      - name: Commit translation work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation-work
          git diff --cached --check
          git commit -m 'work: prepare August batch 04 translations'
          git push origin HEAD:data/2026-08-batch-04-five-journals
