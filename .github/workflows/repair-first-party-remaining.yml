name: Repair first-party remaining journal probes
on:
  push:
    branches: [data/2026-08-finish-remaining]
    paths: [.github/workflows/repair-first-party-remaining.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - name: Repair source-specific probes
        run: |
          python - <<'PY'
          import email.utils,html,json,re,time,xml.etree.ElementTree as ET
          from datetime import datetime,date,timezone
          from pathlib import Path
          from urllib.parse import urljoin,urlparse,parse_qs
          import requests
          from bs4 import BeautifulSoup
          START=date(2026,8,1); END=date(2026,8,14)
          S=requests.Session(); S.headers.update({'User-Agent':'EvidenceRadar-Editions/0.2 first-party-repair'})
          def req(url,**kw):
            last=None
            for i in range(6):
              try:
                r=S.get(url,timeout=40,**kw)
                if r.status_code==429: time.sleep(1+i);continue
                r.raise_for_status();return r
              except Exception as e:last=e;time.sleep(.5*(i+1))
            raise last
          def inwin(s):
            if not s:return False
            try:d=date.fromisoformat(s[:10])
            except:return False
            return START<=d<=END
          def clean(s):return re.sub(r'\s+',' ',BeautifulSoup(html.unescape(str(s or '')),'html.parser').get_text(' ',strip=True)).strip()
          out={}

          # JMLR RSS via stdlib XML parser.
          j={'source':'https://www.jmlr.org/jmlr.xml','items':[],'all_items':[],'errors':[]}
          try:
            root=ET.fromstring(req(j['source']).content)
            for it in root.findall('.//item'):
              val=lambda tag: (it.findtext(tag) or '').strip()
              raw=val('pubDate'); dt=None
              try:dt=email.utils.parsedate_to_datetime(raw).date().isoformat()
              except:pass
              row={'title':clean(val('title')),'url':val('link'),'publication_date':dt,'publication_date_precision':'DAY' if dt else None,'pubDate':raw}
              # common RSS author namespaces
              creators=[]
              for child in list(it):
                if str(child.tag).endswith('creator') and child.text: creators.append(clean(child.text))
              row['authors']=creators
              j['all_items'].append(row)
              if inwin(dt):j['items'].append(row)
          except Exception as e:j['errors'].append(repr(e))
          j['count']=len(j['items']);out['jmlr']=j

          # TMLR: official page snapshot. Try API v1/v2 dates but keep current August list as MONTH-precision evidence.
          t={'source':'https://jmlr.org/tmlr/papers/','snapshot_date':'2026-08-14','items':[],'errors':[]}
          try:
            soup=BeautifulSoup(req(t['source']).text,'html.parser'); candidates=[]
            for h4 in soup.find_all('h4'):
              a=h4.find('a',href=True)
              if not a:continue
              parent=h4.parent; block=parent.get_text(' ',strip=True)
              if 'August 2026' not in block:continue
              href=a['href']; oid=(parse_qs(urlparse(href).query).get('id') or [None])[0]
              if not oid:
                for x in parent.find_all('a',href=True):
                  oid=(parse_qs(urlparse(x['href']).query).get('id') or [None])[0]
                  if oid:break
              # authors are text after h4 before 'August 2026'; fallback parse block
              title=clean(a.get_text(' ',strip=True)); rest=block.replace(title,'',1)
              author_text=rest.split('August 2026',1)[0].strip(' ,-')
              authors=[x.strip() for x in author_text.split(',') if x.strip()]
              row={'title':title,'authors':authors,'openreview_id':oid,'url':'https://openreview.net/forum?id='+oid if oid else href,'publication_date':'2026-08-01','publication_date_precision':'MONTH','official_month_label':'August 2026','date_evidence':'JMLR TMLR official papers page visible in 2026-08-14 snapshot'}
              if oid:
                for api in ('https://api.openreview.net/notes','https://api2.openreview.net/notes'):
                  try:
                    data=req(api,params={'id':oid}).json(); notes=data.get('notes') or []
                    if notes:
                      n=notes[0]; row['openreview_api']=api; row['pdate']=n.get('pdate'); row['odate']=n.get('odate');break
                  except Exception as e: row.setdefault('api_errors',[]).append(repr(e))
              candidates.append(row)
            t['items']=candidates;t['candidate_count']=len(candidates)
          except Exception as e:t['errors'].append(repr(e))
          t['count']=len(t['items']);out['tmlr']=t

          # Chemical Science official RSS feed.
          rsc={'source':'https://feeds.rsc.org/rss/sc','items':[],'all_items':[],'errors':[]}
          try:
            raw=req(rsc['source']).content; root=ET.fromstring(raw)
            for it in root.findall('.//item'):
              val=lambda tag:(it.findtext(tag) or '').strip()
              title=clean(val('title')); link=val('link'); desc=clean(val('description')); rawdate=val('pubDate'); dt=None
              try:dt=email.utils.parsedate_to_datetime(rawdate).date().isoformat()
              except:pass
              dm=re.search(r'DOI:\s*(10\.1039/[A-Za-z0-9.()/_:-]+)',desc,re.I); doi=dm.group(1).rstrip(',.') if dm else None
              # feed description normally includes article type after DOI
              typ=None
              if doi:
                m=re.search(re.escape(doi)+r'\s*,?\s*([^,]+)',desc,re.I)
                if m:typ=m.group(1).strip()
              row={'title':title,'url':link,'doi':doi.lower() if doi else None,'publication_date':dt,'publication_date_precision':'DAY' if dt else None,'pubDate':rawdate,'description':desc,'article_type_hint':typ}
              rsc['all_items'].append(row)
              if inwin(dt): rsc['items'].append(row)
          except Exception as e:rsc['errors'].append(repr(e))
          rsc['count']=len(rsc['items']);out['chemical_science']=rsc

          # TACL: ACL canonical bib list + Crossref per-DOI dates.
          ta={'source':'https://aclanthology.org/volumes/2026.tacl-1/','date_source':'Crossref individual DOI metadata; ACL Anthology supplies canonical membership','items':[],'all_candidates':[],'errors':[]}
          try:
            soup=BeautifulSoup(req(ta['source']).text,'html.parser'); links=sorted(set(urljoin(ta['source'],a['href']) for a in soup.find_all('a',href=True) if re.search(r'2026\.tacl-1\.\d+\.bib$',a['href'])))
            ta['candidate_count']=len(links)
            for i,u in enumerate(links):
              try:
                bib=req(u).text; doi_m=re.search(r'doi\s*=\s*["{]([^"}]+)',bib,re.I); doi=doi_m.group(1).strip() if doi_m else None
                title_m=re.search(r'title\s*=\s*["{](.*?)["}],?\s*(?:author|journal)',bib,re.I|re.S); title=clean(re.sub(r'[{}]','',title_m.group(1))) if title_m else ''
                auth_m=re.search(r'author\s*=\s*["{](.*?)["}],?\s*(?:journal|booktitle)',bib,re.I|re.S); authors=[clean(x) for x in re.split(r'\s+and\s+',auth_m.group(1))] if auth_m else []
                row={'title':title,'authors':authors,'doi':doi.lower() if doi else None,'acl_bib_url':u,'url':u[:-4]+'/' if u.endswith('.bib') else u}
                if doi:
                  try:
                    m=req('https://api.crossref.org/works/'+doi).json()['message']
                    def parts(k):
                      ps=(m.get(k) or {}).get('date-parts') or []
                      if not ps:return (None,None)
                      p=ps[0];prec='DAY' if len(p)>=3 else 'MONTH' if len(p)>=2 else 'YEAR'
                      return ('-'.join([str(p[0]).zfill(4),str(p[1]).zfill(2) if len(p)>=2 else '01',str(p[2]).zfill(2) if len(p)>=3 else '01']),prec)
                    for k in ('published-online','published-print','published','issued'):
                      dt,prec=parts(k)
                      if dt:
                        row['publication_date']=dt;row['publication_date_precision']=prec;row['crossref_date_field']=k;break
                    row['crossref_created']=(m.get('created') or {}).get('date-time')
                  except Exception as e:row['crossref_error']=repr(e)
                ta['all_candidates'].append(row)
                if row.get('publication_date_precision') in ('DAY','MONTH') and inwin(row.get('publication_date')): ta['items'].append(row)
              except Exception as e:ta['all_candidates'].append({'acl_bib_url':u,'error':repr(e)})
              time.sleep(.12)
          except Exception as e:ta['errors'].append(repr(e))
          ta['count']=len(ta['items']);out['tacl']=ta

          Path('probe/remaining-first-party-repaired.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          compact={k:{'count':v.get('count'),'candidate_count':v.get('candidate_count'),'errors':v.get('errors'),'items':v.get('items')} for k,v in out.items()}
          Path('probe/remaining-first-party-repaired-summary.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:{'count':v.get('count'),'candidate_count':v.get('candidate_count'),'errors':v.get('errors')} for k,v in out.items()},ensure_ascii=False,indent=2))
          PY
      - name: Commit repaired probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- probe/remaining-first-party-repaired.json probe/remaining-first-party-repaired-summary.json
          git commit -m 'probe: repair remaining first-party August source checks'
          git pull --rebase origin data/2026-08-finish-remaining
          git push
