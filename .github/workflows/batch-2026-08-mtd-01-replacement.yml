name: Acquire August 2026 MTD batch 01 replacement

on:
  push:
    branches:
      - batch/2026-08-mtd-01
    paths:
      - ".github/workflows/batch-2026-08-mtd-01-replacement.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Acquire replacement journal
        run: |
          mkdir -p dist/journal-of-exercise-science-and-fitness
          python -m evidenceradar_editions run \
            --journal-slug journal-of-exercise-science-and-fitness \
            --start 2026-08-01 \
            --end 2026-08-14 \
            --period-kind month \
            --revision 1 \
            --max-records 500 \
            --output-dir dist/journal-of-exercise-science-and-fitness \
            --translation-request dist/journal-of-exercise-science-and-fitness/translation-request.zh-TW.json
          python -m evidenceradar_editions validate --bundle-dir dist/journal-of-exercise-science-and-fitness
      - name: Upload replacement acquisition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: august-2026-mtd-batch-01-replacement
          path: dist/
          if-no-files-found: error
          retention-days: 7
