name: Translate August 2026 batch 08 full zh-TW
on:
  push:
    branches: [data/2026-08-batch-08-five-journals]
    paths: [.github/workflows/translate-august-batch-08-google-full.yml]
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Translate all retained titles to zh-TW
        run: |
          python - <<'PY'
          import concurrent.futures
          import html
          import json
          import random
          import re
          import threading
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root=Path('translation-work/batch08')
          manifest=json.loads((root/'manifest.json').read_text())
          items=[]
          for p in sorted(root.glob('part-*.json')):
            items.extend(json.loads(p.read_text())['items'])
          assert len(items)==manifest['kept_total']==2887

          pilot_path=root/'google-audit-sample.json'
          pilot={}
          if pilot_path.exists():
            for x in json.loads(pilot_path.read_text()).get('items',[]):
              text=str(x.get('google_zh_tw') or '').strip()
              if text:
                pilot[x['canonical_id']]=text

          lock=threading.Lock()
          done=[0]
          cjk_re=re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff]')
          repeat_re=re.compile(r'(.{1,3})\1\1\1')

          def translate_one(rec):
            cid=rec['canonical_id']
            if cid in pilot:
              text=pilot[cid]
              source='pilot-cache'
            else:
              params={'client':'gtx','sl':'en','tl':'zh-TW','dt':'t','q':rec['title_original']}
              url='https://translate.googleapis.com/translate_a/single?'+urllib.parse.urlencode(params)
              last=None
              for attempt in range(9):
                try:
                  if attempt:
                    time.sleep(min(20,1.4**attempt)+random.random())
                  else:
                    time.sleep(random.random()*0.18)
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (EvidenceRadar Editions title translation)'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                    data=json.loads(r.read().decode('utf-8'))
                  text=''.join(part[0] for part in data[0] if part and part[0]).strip()
                  text=html.unescape(text)
                  if text:
                    break
                except Exception as exc:
                  last=exc
              else:
                raise RuntimeError(f'{cid}: translation failed after retries: {last}')
              source='google-zh-TW'
            flags=[]
            if not cjk_re.search(text): flags.append('NO_CJK')
            if text.casefold()==rec['title_original'].casefold(): flags.append('UNCHANGED')
            if len(text)<2: flags.append('TOO_SHORT')
            if repeat_re.search(text): flags.append('REPETITION')
            with lock:
              done[0]+=1
              if done[0] % 100 == 0 or done[0]==len(items):
                print('translated',done[0],'/',len(items),flush=True)
            return {
              'canonical_id':cid,
              'journal':rec['journal'],
              'slug':rec['slug'],
              'title_original':rec['title_original'],
              'title_zh_tw':text,
              'engine':source,
              'quality_flags':flags,
            }

          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
            futures=[pool.submit(translate_one,x) for x in items]
            for f in concurrent.futures.as_completed(futures):
              out.append(f.result())
          order={x['canonical_id']:i for i,x in enumerate(items)}
          out.sort(key=lambda x:order[x['canonical_id']])
          assert len(out)==2887 and len({x['canonical_id'] for x in out})==2887
          flags=[x for x in out if x['quality_flags']]
          ledger={
            'artifact_type':'EvidenceRadar_Editions_TranslationCandidateLedger',
            'language':'zh-TW',
            'engine':'translate.googleapis.com public zh-TW endpoint',
            'item_count':len(out),
            'quality_flag_count':len(flags),
            'items':out,
          }
          (root/'google-full-ledger.json').write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          (root/'google-quality-flags.json').write_text(json.dumps({'item_count':len(flags),'items':flags},ensure_ascii=False,indent=2)+'\n')
          picks=sorted(set([0,len(out)//4,len(out)//2,3*len(out)//4,len(out)-1,*range(0,len(out),113)]))
          sample=[out[i] for i in picks]
          (root/'google-full-audit-sample.json').write_text(json.dumps({'item_count':len(sample),'items':sample},ensure_ascii=False,indent=2)+'\n')
          print('complete',len(out),'quality_flags',len(flags),'sample',len(sample))
          PY
      - name: Commit full translation ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation-work/batch08/google-full-ledger.json translation-work/batch08/google-quality-flags.json translation-work/batch08/google-full-audit-sample.json
          git commit -m 'translation: complete August batch 08 full zh-TW candidate ledger'
          git pull --rebase origin data/2026-08-batch-08-five-journals
          git push
