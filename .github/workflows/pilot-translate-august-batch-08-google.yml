name: Pilot August batch 08 Google translation
on:
  push:
    branches: [data/2026-08-batch-08-five-journals]
    paths: [.github/workflows/pilot-translate-august-batch-08-google.yml]
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Translate audit sample through public zh-TW endpoint
        run: |
          python - <<'PY'
          import json,time,urllib.parse,urllib.request
          from pathlib import Path
          sample=json.loads(Path('translation-work/batch08/mt-audit-sample.json').read_text())['items']
          out=[]
          for i,item in enumerate(sample):
            q=urllib.parse.urlencode({'client':'gtx','sl':'en','tl':'zh-TW','dt':'t','q':item['title_original']})
            url='https://translate.googleapis.com/translate_a/single?'+q
            last=None
            for attempt in range(5):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                with urllib.request.urlopen(req,timeout=20) as r:
                  data=json.loads(r.read().decode())
                text=''.join(part[0] for part in data[0] if part and part[0]).strip()
                if text: break
              except Exception as e:
                last=e; time.sleep(1.5*(attempt+1))
            else: raise RuntimeError(f'translation failed: {last}')
            out.append({**item,'google_zh_tw':text})
            time.sleep(0.15)
          Path('translation-work/batch08/google-audit-sample.json').write_text(json.dumps({'items':out},ensure_ascii=False,indent=2)+'\n')
          print('pilot translated',len(out))
          PY
      - name: Commit pilot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation-work/batch08/google-audit-sample.json
          git commit -m 'translation: pilot batch 08 higher-quality zh-TW endpoint'
          git push
