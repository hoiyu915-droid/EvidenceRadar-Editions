name: Publish EvidenceRadar Editions portal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "editions/**"
      - "catalog/**"
      - "evidenceradar_editions/**"
      - "pyproject.toml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evidenceradar-editions-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install and validate
        run: |
          python -m pip install -e .
          python -m compileall -q evidenceradar_editions tests
          python -m unittest discover -s tests -v
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build portal from canonical editions store
        run: |
          python -m evidenceradar_editions build-pages \
            --editions-root editions \
            --catalog-root catalog \
            --repository "$GITHUB_REPOSITORY" \
            --base-url "${{ steps.pages.outputs.base_url }}" \
            --output-dir _site
      - name: Run abstract review and bounded full-text delivery
        run: |
          rm -rf \
            "$RUNNER_TEMP/research-pipeline" \
            "$RUNNER_TEMP/abstract-payloads" \
            "$RUNNER_TEMP/fulltext-payloads"
          python -m evidenceradar_editions.review_fulltext_delivery \
            --site-dir _site \
            --work-dir "$RUNNER_TEMP/research-pipeline" \
            --abstract-payload-dir "$RUNNER_TEMP/abstract-payloads" \
            --fulltext-payload-dir "$RUNNER_TEMP/fulltext-payloads" \
            --catalog-root catalog \
            --maximum-abstract-items 300 \
            --maximum-fulltext-items 120
      - name: Validate safe research delivery
        run: |
          test ! -e "$RUNNER_TEMP/abstract-payloads"
          test ! -e "$RUNNER_TEMP/fulltext-payloads"

          for file in \
            abstract-fetch-plan.json \
            abstract-acquisition-receipts.json \
            abstract-review.json \
            abstract-review-policy.json \
            fulltext-fetch-plan.json \
            fulltext-acquisition-receipts.json \
            evidence-review-plan.json \
            abstract-payload-disposition.json \
            fulltext-payload-disposition.json \
            abstract-review-fulltext-manifest.json
          do
            test -s "$RUNNER_TEMP/research-pipeline/$file"
          done

          for file in \
            abstract-acquisition.json \
            abstract-acquisition.html \
            abstract-review.json \
            abstract-review.html \
            abstract-review-policy.json \
            fulltext-fetch-plan.json \
            fulltext-acquisition.json \
            fulltext-acquisition.html \
            evidence-review-plan.json
          do
            test -s "_site/$file"
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path("_site")
          work = Path(os.environ["RUNNER_TEMP"]) / "research-pipeline"

          acquisition = json.loads((site / "abstract-acquisition.json").read_text())
          review = json.loads((site / "abstract-review.json").read_text())
          fulltext_plan = json.loads((site / "fulltext-fetch-plan.json").read_text())
          fulltext = json.loads((site / "fulltext-acquisition.json").read_text())
          evidence = json.loads((site / "evidence-review-plan.json").read_text())
          abstract_disposition = json.loads((work / "abstract-payload-disposition.json").read_text())
          fulltext_disposition = json.loads((work / "fulltext-payload-disposition.json").read_text())

          assert acquisition["receipt_count"] == acquisition["plan_item_count"] <= 300
          assert review["counts"]["abstract_acquired"] == acquisition["counts"]["abstract_acquired"]
          assert review["counts"]["fulltext_now_count"] == fulltext_plan["item_count"] <= 120
          assert fulltext["receipt_count"] == fulltext["plan_item_count"] == fulltext_plan["item_count"]
          assert evidence["item_count"] == fulltext["counts"]["fulltext_acquired"]
          assert sum(fulltext["counts"]["by_status"].values()) == fulltext["receipt_count"]
          assert all(item["evidence_evaluated"] is False for item in fulltext["items"])
          assert all(item["evidence_evaluated"] is False for item in evidence["items"])
          assert all(
              item["abstract_reviewed"] is True
              for item in review["items"]
              if item["fulltext_route"] in {"FULLTEXT_NOW", "FULLTEXT_RESERVE"}
          )

          forbidden_fields = {
              "abstract",
              "abstract_text",
              "abstractText",
              "payload_text",
              "raw_response",
              "fulltext",
              "full_text",
              "fulltext_text",
              "full_text_text",
              "raw_fulltext",
          }
          def assert_sanitized(value):
              if isinstance(value, dict):
                  overlap = set(value).intersection(forbidden_fields)
                  assert not overlap, f"forbidden public fields: {sorted(overlap)}"
                  for child in value.values():
                      assert_sanitized(child)
              elif isinstance(value, list):
                  for child in value:
                      assert_sanitized(child)

          for artifact in (acquisition, review, fulltext, evidence):
              assert_sanitized(artifact)

          assert abstract_disposition["disposition"] == "DELETED_BEFORE_ARTIFACT_UPLOAD"
          assert abstract_disposition["abstract_text_published"] is False
          assert fulltext_disposition["disposition"] == "DELETED_BEFORE_ARTIFACT_UPLOAD"
          assert fulltext_disposition["fulltext_published"] is False
          assert fulltext_disposition["evidence_evaluated"] is False

          print(json.dumps({
              "abstract_planned": acquisition["plan_item_count"],
              "abstract_acquired": acquisition["counts"]["abstract_acquired"],
              "abstract_reviewed": review["counts"]["abstract_acquired"],
              "fulltext_planned": fulltext_plan["item_count"],
              "fulltext_acquired": fulltext["counts"]["fulltext_acquired"],
              "fulltext_route_not_found": fulltext["counts"]["route_not_found"],
              "fulltext_access_denied": fulltext["counts"]["access_denied"],
              "fulltext_not_found": fulltext["counts"]["not_found"],
              "fulltext_inconclusive": fulltext["counts"]["acquisition_inconclusive"],
              "evidence_review_ready": evidence["item_count"],
              "fulltext_receipt_binding_sha256": fulltext["receipt_binding_sha256"],
          }, sort_keys=True))
          PY
      - name: Write research pipeline summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          a = json.loads(Path("_site/abstract-acquisition.json").read_text())
          r = json.loads(Path("_site/abstract-review.json").read_text())
          f = json.loads(Path("_site/fulltext-acquisition.json").read_text())
          e = json.loads(Path("_site/evidence-review-plan.json").read_text())

          print("## Abstract review → full-text delivery")
          print()
          print(f"- abstract planned: `{a['plan_item_count']}`")
          print(f"- abstract acquired: `{a['counts']['abstract_acquired']}`")
          print(f"- abstract structurally reviewed: `{r['counts']['abstract_acquired']}`")
          print(f"- full-text planned: `{r['counts']['fulltext_now_count']}`")
          print(f"- full-text acquired: `{f['counts']['fulltext_acquired']}`")
          print(f"- no safe full-text route: `{f['counts']['route_not_found']}`")
          print(f"- full-text access denied: `{f['counts']['access_denied']}`")
          print(f"- full-text acquisition inconclusive: `{f['counts']['acquisition_inconclusive']}`")
          print(f"- evidence-review-ready: `{e['item_count']}`")
          print("- evidence evaluated: `0`")
          print("- abstract payloads: `deleted before artifact upload`")
          print("- full-text payloads: `deleted before artifact upload`")
          PY
      - name: Upload safe review and full-text receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EvidenceRadar-Editions__abstract-review-fulltext
          path: ${{ runner.temp }}/research-pipeline/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
