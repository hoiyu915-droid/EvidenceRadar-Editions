name: Publish EvidenceRadar Editions portal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "editions/**"
      - "catalog/**"
      - "evidenceradar_editions/**"
      - "pyproject.toml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evidenceradar-editions-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install and validate
        run: |
          python -m pip install -e .
          python -m compileall -q evidenceradar_editions tests
          python -m unittest discover -s tests -v
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build portal from canonical editions store
        run: |
          python -m evidenceradar_editions build-pages \
            --editions-root editions \
            --catalog-root catalog \
            --repository "$GITHUB_REPOSITORY" \
            --base-url "${{ steps.pages.outputs.base_url }}" \
            --output-dir _site
      - name: Execute bounded abstract acquisition
        run: |
          rm -rf "$RUNNER_TEMP/abstract-acquisition" "$RUNNER_TEMP/abstract-payloads"
          python -m evidenceradar_editions.abstract_acquisition_delivery \
            --site-dir _site \
            --work-dir "$RUNNER_TEMP/abstract-acquisition" \
            --payload-dir "$RUNNER_TEMP/abstract-payloads" \
            --maximum-items 300
      - name: Validate safe acquisition delivery
        run: |
          test ! -e "$RUNNER_TEMP/abstract-payloads"
          test -s "$RUNNER_TEMP/abstract-acquisition/abstract-fetch-plan.json"
          test -s "$RUNNER_TEMP/abstract-acquisition/abstract-acquisition-receipts.json"
          test -s "$RUNNER_TEMP/abstract-acquisition/abstract-acquisition-manifest.json"
          test -s "$RUNNER_TEMP/abstract-acquisition/abstract-payload-disposition.json"
          test -s "_site/abstract-acquisition.json"
          test -s "_site/abstract-acquisition.html"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path("_site")
          receipts = json.loads((site / "abstract-acquisition.json").read_text())
          plan = json.loads((site / "abstract-fetch-plan.json").read_text())
          assert receipts["artifact_type"] == "EvidenceRadar_Editions_AbstractAcquisitionReceipts"
          assert receipts["plan_binding_sha256"] == plan["plan_binding_sha256"]
          assert receipts["receipt_count"] == receipts["plan_item_count"] == plan["item_count"]
          assert receipts["receipt_count"] <= 300
          assert sum(receipts["counts"]["by_status"].values()) == receipts["receipt_count"]
          assert all(item["abstract_reviewed"] is False for item in receipts["items"])
          assert all(item["full_text_fetched"] is False for item in receipts["items"])
          assert all(item["evidence_evaluated"] is False for item in receipts["items"])

          forbidden_fields = {
              "abstract",
              "abstract_text",
              "abstractText",
              "payload_text",
              "raw_response",
          }
          def assert_sanitized(value):
              if isinstance(value, dict):
                  overlap = set(value).intersection(forbidden_fields)
                  assert not overlap, f"forbidden public fields: {sorted(overlap)}"
                  for child in value.values():
                      assert_sanitized(child)
              elif isinstance(value, list):
                  for child in value:
                      assert_sanitized(child)
          assert_sanitized(receipts)

          disposition = json.loads((Path(os.environ["RUNNER_TEMP"]) / "abstract-acquisition" / "abstract-payload-disposition.json").read_text())
          assert disposition["disposition"] == "DELETED_BEFORE_ARTIFACT_UPLOAD"
          assert disposition["abstract_text_published"] is False
          print(json.dumps({"planned": receipts["plan_item_count"], "acquired": receipts["counts"]["abstract_acquired"], "no_abstract": receipts["counts"]["abstract_not_present"], "not_found": receipts["counts"]["record_not_found"], "inconclusive": receipts["counts"]["acquisition_inconclusive"], "receipt_binding_sha256": receipts["receipt_binding_sha256"]}, sort_keys=True))
          PY
      - name: Write acquisition summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("_site/abstract-acquisition.json").read_text())
          c = r["counts"]
          print("## Abstract acquisition")
          print()
          print(f"- planned: `{r['plan_item_count']}`")
          print(f"- abstract acquired: `{c['abstract_acquired']}`")
          print(f"- exact record, no abstract: `{c['abstract_not_present']}`")
          print(f"- record not found: `{c['record_not_found']}`")
          print(f"- acquisition inconclusive: `{c['acquisition_inconclusive']}`")
          print("- abstract reviewed: `0`")
          print("- full text fetched: `0`")
          print("- evidence evaluated: `0`")
          print("- payload disposition: `deleted before artifact upload`")
          PY
      - name: Upload safe acquisition receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EvidenceRadar-Editions__abstract-acquisition
          path: ${{ runner.temp }}/abstract-acquisition/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
