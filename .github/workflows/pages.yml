name: Publish EvidenceRadar Editions portal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "editions/**"
      - "catalog/**"
      - "evidenceradar_editions/**"
      - "pyproject.toml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evidenceradar-editions-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install and validate
        run: |
          python -m pip install -e .
          python -m compileall -q evidenceradar_editions tests
          python -m unittest discover -s tests -v
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build portal from canonical editions store
        run: |
          python -m evidenceradar_editions build-pages \
            --editions-root editions \
            --catalog-root catalog \
            --repository "$GITHUB_REPOSITORY" \
            --base-url "${{ steps.pages.outputs.base_url }}" \
            --output-dir _site \
            --allow-untranslated
      - name: Run default end-to-end Edition evidence lane
        run: |
          rm -rf \
            "$RUNNER_TEMP/complete-edition" \
            "$RUNNER_TEMP/abstract-payloads" \
            "$RUNNER_TEMP/fulltext-payloads"
          python -m evidenceradar_editions.complete_edition_delivery \
            --site-dir _site \
            --work-dir "$RUNNER_TEMP/complete-edition" \
            --abstract-payload-dir "$RUNNER_TEMP/abstract-payloads" \
            --fulltext-payload-dir "$RUNNER_TEMP/fulltext-payloads" \
            --catalog-root catalog \
            --maximum-abstract-items 300 \
            --maximum-fulltext-items 120
      - name: Validate complete safe Edition delivery
        run: |
          test ! -e "$RUNNER_TEMP/abstract-payloads"
          test ! -e "$RUNNER_TEMP/fulltext-payloads"

          for file in \
            abstract-fetch-plan.json \
            abstract-acquisition-receipts.json \
            abstract-review.json \
            abstract-review-policy.json \
            fulltext-fetch-plan.json \
            fulltext-acquisition-receipts.json \
            evidence-review-plan.json \
            evidence-evaluation-policy.json \
            evidence-evaluation.json \
            evaluated-edition.json \
            abstract-payload-disposition.json \
            fulltext-payload-disposition.json \
            complete-edition-manifest.json
          do
            test -s "$RUNNER_TEMP/complete-edition/$file"
          done

          for file in \
            abstract-acquisition.json \
            abstract-acquisition.html \
            abstract-review.json \
            abstract-review.html \
            abstract-review-policy.json \
            fulltext-fetch-plan.json \
            fulltext-acquisition.json \
            fulltext-acquisition.html \
            evidence-review-plan.json \
            evidence-evaluation-policy.json \
            evidence-evaluation.json \
            evidence-evaluation.html \
            evaluated-edition.json \
            evaluated-edition.html
          do
            test -s "_site/$file"
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path("_site")
          work = Path(os.environ["RUNNER_TEMP"]) / "complete-edition"

          acquisition = json.loads((site / "abstract-acquisition.json").read_text())
          review = json.loads((site / "abstract-review.json").read_text())
          fulltext_plan = json.loads((site / "fulltext-fetch-plan.json").read_text())
          fulltext = json.loads((site / "fulltext-acquisition.json").read_text())
          evidence_plan = json.loads((site / "evidence-review-plan.json").read_text())
          evaluation = json.loads((site / "evidence-evaluation.json").read_text())
          editorial = json.loads((site / "evaluated-edition.json").read_text())
          abstract_disposition = json.loads((work / "abstract-payload-disposition.json").read_text())
          fulltext_disposition = json.loads((work / "fulltext-payload-disposition.json").read_text())

          assert acquisition["receipt_count"] == acquisition["plan_item_count"] <= 300
          assert review["counts"]["abstract_acquired"] == acquisition["counts"]["abstract_acquired"]
          assert review["counts"]["fulltext_now_count"] == fulltext_plan["item_count"] <= 120
          assert fulltext["receipt_count"] == fulltext["plan_item_count"] == fulltext_plan["item_count"]
          assert evidence_plan["item_count"] == fulltext["counts"]["fulltext_acquired"]
          assert evaluation["counts"]["fulltext_acquired"] == fulltext["counts"]["fulltext_acquired"]
          assert evaluation["counts"]["evidence_evaluated"] + evaluation["counts"]["limited_no_machine_text"] == fulltext["counts"]["fulltext_acquired"]
          assert editorial["counts"]["evidence_evaluated"] == evaluation["counts"]["evidence_evaluated"]
          assert editorial["counts"]["featured"] <= 36
          assert all(item["evidence_evaluated"] is True for item in editorial["items"] if item["editorial_route"] == "FEATURED")
          assert all(item["risk_of_bias_evaluated"] is False for item in evaluation["items"])
          assert sum(fulltext["counts"]["by_status"].values()) == fulltext["receipt_count"]

          forbidden_fields = {
              "abstract", "abstract_text", "abstractText", "payload_text", "raw_response",
              "fulltext", "full_text", "fulltext_text", "full_text_text", "raw_fulltext",
          }
          def assert_sanitized(value):
              if isinstance(value, dict):
                  overlap = set(value).intersection(forbidden_fields)
                  assert not overlap, f"forbidden public fields: {sorted(overlap)}"
                  for child in value.values():
                      assert_sanitized(child)
              elif isinstance(value, list):
                  for child in value:
                      assert_sanitized(child)

          for artifact in (acquisition, review, fulltext, evidence_plan, evaluation, editorial):
              assert_sanitized(artifact)

          assert abstract_disposition["disposition"] == "DELETED_BEFORE_ARTIFACT_UPLOAD"
          assert abstract_disposition["abstract_text_published"] is False
          assert fulltext_disposition["disposition"] == "DELETED_BEFORE_ARTIFACT_UPLOAD"
          assert fulltext_disposition["fulltext_published"] is False
          assert fulltext_disposition["evidence_evaluated_count"] == evaluation["counts"]["evidence_evaluated"]

          print(json.dumps({
              "abstract_planned": acquisition["plan_item_count"],
              "abstract_acquired": acquisition["counts"]["abstract_acquired"],
              "abstract_reviewed": review["counts"]["abstract_acquired"],
              "fulltext_planned": fulltext_plan["item_count"],
              "fulltext_acquired": fulltext["counts"]["fulltext_acquired"],
              "evidence_evaluated": evaluation["counts"]["evidence_evaluated"],
              "limited_no_machine_text": evaluation["counts"]["limited_no_machine_text"],
              "featured": editorial["counts"]["featured"],
              "evidence_reserve": editorial["counts"]["evidence_reserve"],
              "fulltext_route_not_found": fulltext["counts"]["route_not_found"],
              "fulltext_inconclusive": fulltext["counts"]["acquisition_inconclusive"],
              "evaluated_edition_binding_sha256": editorial["evaluated_edition_binding_sha256"],
          }, sort_keys=True))
          PY
      - name: Write complete Edition summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          a = json.loads(Path("_site/abstract-acquisition.json").read_text())
          r = json.loads(Path("_site/abstract-review.json").read_text())
          f = json.loads(Path("_site/fulltext-acquisition.json").read_text())
          e = json.loads(Path("_site/evidence-evaluation.json").read_text())
          c = json.loads(Path("_site/evaluated-edition.json").read_text())

          print("## Default end-to-end Edition lane")
          print()
          print(f"- abstract planned: `{a['plan_item_count']}`")
          print(f"- abstract acquired: `{a['counts']['abstract_acquired']}`")
          print(f"- abstract structurally reviewed: `{r['counts']['abstract_acquired']}`")
          print(f"- full-text planned: `{r['counts']['fulltext_now_count']}`")
          print(f"- full-text acquired: `{f['counts']['fulltext_acquired']}`")
          print(f"- evidence-reporting audits completed: `{e['counts']['evidence_evaluated']}`")
          print(f"- limited machine-text review: `{e['counts']['limited_no_machine_text']}`")
          print(f"- FEATURED: `{c['counts']['featured']}`")
          print(f"- evidence reserve: `{c['counts']['evidence_reserve']}`")
          print("- formal risk-of-bias grades: `not claimed`")
          print("- abstract/full-text payloads: `deleted before artifact upload`")
          PY
      - name: Upload safe complete Edition receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EvidenceRadar-Editions__complete-edition
          path: ${{ runner.temp }}/complete-edition/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
