name: Extract August 2026 batch 05 translation work

on:
  push:
    branches:
      - data/2026-08-batch-05-five-journals
    paths:
      - ".github/workflows/extract-august-batch-05-titles.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Build translation work chunks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          slugs=[
            'computer-speech-and-language',
            'computers-and-education-artificial-intelligence',
            'computers-in-human-behavior-artificial-humans',
            'computers-in-human-behavior-reports',
            'international-journal-of-human-computer-studies',
          ]
          excluded=set()
          flags=json.loads(Path('probe/flags.json').read_text(encoding='utf-8'))
          excluded.update(str(x.get('canonical_id')) for x in flags.get('items',[]) if x.get('canonical_id'))
          repl=json.loads(Path('probe/replacement-summary.json').read_text(encoding='utf-8'))
          excluded.update(str(x.get('canonical_id')) for x in repl.get('flags',[]) if x.get('canonical_id'))
          rows=[]
          for slug in slugs:
              d=Path('probe')/slug
              files=[p for p in d.glob('*.json') if not p.name.endswith('.manifest.json') and 'translation-' not in p.name]
              if len(files)!=1: raise SystemExit(f'{slug}: {files}')
              run=json.loads(files[0].read_text(encoding='utf-8'))
              for a in run.get('articles') or []:
                  cid=str(a.get('canonical_id') or '')
                  if cid in excluded: continue
                  rows.append({'canonical_id':cid,'title':a.get('title_original') or a.get('title'),'slug':slug})
          if len(rows)!=149: raise SystemExit(f'expected 149 retained rows, got {len(rows)}')
          out=Path('translation-work'); out.mkdir(exist_ok=True)
          for old in out.glob('batch05.part*.ndjson'): old.unlink()
          size=20
          parts=0
          for i in range(0,len(rows),size):
              parts+=1
              p=out/f'batch05.part{parts:02d}.ndjson'
              with p.open('w',encoding='utf-8') as f:
                  for row in rows[i:i+size]:
                      f.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
          (out/'manifest.json').write_text(json.dumps({'expected_items':len(rows),'parts':parts},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'expected_items':len(rows),'parts':parts},indent=2))
          PY
      - name: Commit translation work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation-work
          git diff --cached --check
          git commit -m 'work: extract August 2026 batch 05 translation titles'
          git push origin HEAD:data/2026-08-batch-05-five-journals
