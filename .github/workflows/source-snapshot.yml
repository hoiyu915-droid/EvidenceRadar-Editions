name: Source snapshot (temporary)

on:
  push:
    branches:
      - feat/editions-v0.2-publication

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack repository source
        run: |
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude='__pycache__' \
            -czf /tmp/evidenceradar-editions-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: evidenceradar-editions-source
          path: /tmp/evidenceradar-editions-source.tar.gz
          if-no-files-found: error
          retention-days: 1
