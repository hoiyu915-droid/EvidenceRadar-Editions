name: Seal August 2026 batch 08 canonical editions
on:
  push:
    branches: [data/2026-08-batch-08-five-journals]
    paths: [.github/workflows/seal-august-batch-08.yml]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Install current Editions engine
        run: python -m pip install -e .
      - name: Seal five full August MTD editions
        run: python tools/seal_august_batch08.py
      - name: Commit canonical data and registry only
        run: |
          rm -rf probe translation-work tools/seal_august_batch08.py
          rm -f \
            .github/workflows/acquire-august-batch-08-selected.yml \
            .github/workflows/acquire-august-batch-08-replacements.yml \
            .github/workflows/prepare-august-batch-08-title-work.yml \
            .github/workflows/translate-august-batch-08.yml \
            .github/workflows/pilot-translate-august-batch-08-google.yml \
            .github/workflows/translate-august-batch-08-google-full.yml \
            .github/workflows/seal-august-batch-08.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: publish August 2026 batch 08 five-journal full editions'
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 16
          test "$(printf '%s\n' "${files[@]}" | grep -Ec '^editions/[^/]+/2026/08/r01/(edition|manifest|storage)\.json$')" -eq 15
          test "$(printf '%s\n' "${files[@]}" | grep -Ec '^catalog/journals\.json$')" -eq 1
          test "$(printf '%s\n' "${files[@]}" | grep -Evc '^(editions/[^/]+/2026/08/r01/(edition|manifest|storage)\.json|catalog/journals\.json)$')" -eq 0
          if find editions -type f \( -name '*.html' -o -name '*.zip' \) -print -quit | grep -q .; then
            echo 'generated HTML/ZIP leaked into canonical store' >&2
            exit 1
          fi
          git push
