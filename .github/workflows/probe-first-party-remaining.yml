name: Probe first-party sources for remaining August journals
on:
  push:
    branches: [data/2026-08-finish-remaining]
    paths: [.github/workflows/probe-first-party-remaining.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python -m pip install requests beautifulsoup4
      - name: Probe official JMLR TMLR RSC and TACL publication dates
        run: |
          python - <<'PY'
          import concurrent.futures,email.utils,json,re,time
          from datetime import datetime,timezone,date
          from pathlib import Path
          from urllib.parse import urljoin,urlparse,parse_qs
          import requests
          from bs4 import BeautifulSoup

          START=date(2026,8,1); END=date(2026,8,14)
          S=requests.Session(); S.headers.update({'User-Agent':'EvidenceRadar-Editions/0.2 first-party-probe'})
          def get(url,**kw):
            for i in range(5):
              try:
                r=S.get(url,timeout=45,**kw)
                if r.status_code==429: time.sleep(1.2*(i+1)); continue
                r.raise_for_status(); return r
              except Exception:
                if i==4: raise
                time.sleep(.7*(i+1))
          def iso_from_ms(v):
            if not v:return None
            return datetime.fromtimestamp(v/1000,timezone.utc).date().isoformat()
          def in_window(s):
            if not s:return False
            try:d=date.fromisoformat(s[:10])
            except:return False
            return START<=d<=END

          result={}
          # JMLR RSS: official publication feed
          jmlr={'source':'https://www.jmlr.org/jmlr.xml','items':[],'errors':[]}
          try:
            r=get(jmlr['source']); soup=BeautifulSoup(r.content,'xml')
            for item in soup.find_all('item'):
              title=item.title.get_text(' ',strip=True) if item.title else ''
              link=item.link.get_text(strip=True) if item.link else ''
              raw=item.pubDate.get_text(strip=True) if item.pubDate else ''
              try: dt=email.utils.parsedate_to_datetime(raw).date().isoformat()
              except Exception: dt=None
              if in_window(dt):
                jmlr['items'].append({'title':title,'url':link,'publication_date':dt,'publication_date_precision':'DAY','pubDate':raw})
          except Exception as e:jmlr['errors'].append(repr(e))
          jmlr['count']=len(jmlr['items']); result['jmlr']=jmlr

          # TMLR official papers page + OpenReview pdate
          tmlr={'source':'https://jmlr.org/tmlr/papers/','items':[],'errors':[],'august_candidates':0}
          try:
            html=get(tmlr['source']).text; soup=BeautifulSoup(html,'html.parser')
            candidates=[]
            for h4 in soup.find_all('h4'):
              a=h4.find('a',href=True)
              if not a: continue
              block=h4.parent.get_text(' ',strip=True)
              if 'August 2026' not in block: continue
              href=a['href']; qs=parse_qs(urlparse(href).query); oid=(qs.get('id') or [None])[0]
              if not oid:
                # nearby openreview link
                for x in h4.parent.find_all('a',href=True):
                  q=parse_qs(urlparse(x['href']).query); oid=(q.get('id') or [None])[0]
                  if oid: break
              candidates.append((a.get_text(' ',strip=True),oid,href,block))
            tmlr['august_candidates']=len(candidates)
            def tmlr_one(x):
              title,oid,href,block=x
              if not oid:return {'title':title,'openreview_id':None,'error':'no_openreview_id'}
              try:
                d=get('https://api2.openreview.net/notes',params={'id':oid}).json()
                notes=d.get('notes') or []
                if not notes:return {'title':title,'openreview_id':oid,'error':'note_not_found'}
                n=notes[0]; p=iso_from_ms(n.get('pdate')); o=iso_from_ms(n.get('odate'))
                c=n.get('content') or {}
                val=lambda k: (c.get(k) or {}).get('value') if isinstance(c.get(k),dict) else c.get(k)
                authors=val('authors') or []
                return {'title':val('title') or title,'authors':authors if isinstance(authors,list) else [],'openreview_id':oid,'url':'https://openreview.net/forum?id='+oid,'publication_date':p,'online_date':o,'pdate_ms':n.get('pdate'),'odate_ms':n.get('odate')}
              except Exception as e:return {'title':title,'openreview_id':oid,'error':repr(e)}
            with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              rows=list(ex.map(tmlr_one,candidates))
            tmlr['all_august_metadata']=rows
            tmlr['items']=[x for x in rows if in_window(x.get('publication_date'))]
          except Exception as e:tmlr['errors'].append(repr(e))
          tmlr['count']=len(tmlr['items']); result['tmlr']=tmlr

          # Chemical Science: Crossref created-date only to enumerate candidates; RSC First published is authority.
          chem={'source':'https://pubs.rsc.org/','candidate_source':'Crossref created-date enumeration only','items':[],'errors':[]}
          try:
            cr=get('https://api.crossref.org/works',params={'filter':'from-created-date:2026-08-01,until-created-date:2026-08-14,type:journal-article,issn:2041-6539','rows':1000,'select':'DOI,title,container-title,ISSN,author,URL,type'}).json()['message']
            candidates=[]
            for raw in cr.get('items') or []:
              doi=str(raw.get('DOI') or '').lower(); title=(raw.get('title') or [''])[0]
              if doi.startswith('10.1039/'):
                candidates.append((doi,title,raw))
            chem['candidate_count']=len(candidates)
            def rsc_one(x):
              doi,title,raw=x; suffix=doi.split('/',1)[1]
              url='https://pubs.rsc.org/en/content/articlelanding/2026/sc/'+suffix
              try:
                text=get(url).text; soup=BeautifulSoup(text,'html.parser'); plain=soup.get_text('\n',strip=True)
                m=re.search(r'First published\s*\n?\s*(\d{1,2}\s+[A-Za-z]{3}\s+2026)',plain,re.I)
                if not m:m=re.search(r'The article was first published on\s+(\d{1,2}\s+[A-Za-z]{3}\s+2026)',plain,re.I)
                dt=datetime.strptime(m.group(1),'%d %b %Y').date().isoformat() if m else None
                typ=None
                mt=re.search(r'Article type\s*\n?\s*([^\n]+)',plain,re.I)
                if mt:typ=mt.group(1).strip()
                authors=[]
                for p in raw.get('author') or []:
                  if isinstance(p,dict):
                    n=' '.join(str(p.get(k) or '').strip() for k in ('given','family')).strip()
                    if n:authors.append(n)
                return {'doi':doi,'title':title,'authors':authors,'url':url,'publication_date':dt,'publication_date_precision':'DAY' if dt else None,'article_type_first_party':typ}
              except Exception as e:return {'doi':doi,'title':title,'url':url,'error':repr(e)}
            with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              rows=list(ex.map(rsc_one,candidates))
            chem['audited_candidates']=rows
            chem['items']=[x for x in rows if in_window(x.get('publication_date')) and str(x.get('article_type_first_party') or '').casefold() not in {'front/back matter','cover'}]
            chem['front_matter_in_window']=[x for x in rows if in_window(x.get('publication_date')) and str(x.get('article_type_first_party') or '').casefold() in {'front/back matter','cover'}]
          except Exception as e:chem['errors'].append(repr(e))
          chem['count']=len(chem['items']); result['chemical_science']=chem

          # TACL: ACL Anthology gives canonical paper list/DOIs, MIT Press landing gives publication day.
          tacl={'source':'https://aclanthology.org/volumes/2026.tacl-1/','date_authority':'MIT Press article landing','items':[],'errors':[]}
          try:
            vol=get(tacl['source']).text; soup=BeautifulSoup(vol,'html.parser')
            bib_links=[]
            for a in soup.find_all('a',href=True):
              href=urljoin(tacl['source'],a['href'])
              if re.search(r'/2026\.tacl-1\.\d+\.bib$',href): bib_links.append(href)
            bib_links=sorted(set(bib_links)); tacl['candidate_count']=len(bib_links)
            def tacl_one(url):
              try:
                bib=get(url).text
                titlem=re.search(r'title\s*=\s*["{](.*?)["}],?\s*(?:author|journal)',bib,re.I|re.S)
                title=re.sub(r'[{}]','',titlem.group(1)).strip() if titlem else ''
                doim=re.search(r'doi\s*=\s*["{]([^"}]+)',bib,re.I); doi=doim.group(1).strip() if doim else None
                authm=re.search(r'author\s*=\s*["{](.*?)["}],?\s*(?:journal|booktitle)',bib,re.I|re.S)
                authors=[re.sub(r'\s+',' ',x).strip() for x in re.split(r'\s+and\s+',authm.group(1))] if authm else []
                if not doi:return {'bib_url':url,'title':title,'error':'missing_doi'}
                r=get('https://doi.org/'+doi,allow_redirects=True); landing=r.url; text=r.text; s=BeautifulSoup(text,'html.parser')
                dt=None
                for key in ('citation_online_date','citation_publication_date','DC.Date','dc.date'):
                  tag=s.find('meta',attrs={'name':re.compile('^'+re.escape(key)+'$',re.I)})
                  if tag and tag.get('content'):
                    raw=tag['content'].strip()
                    for fmt in ('%Y/%m/%d','%Y-%m-%d','%B %d %Y','%b %d %Y','%m/%d/%Y'):
                      try:dt=datetime.strptime(raw,fmt).date().isoformat();break
                      except:pass
                  if dt:break
                if not dt:
                  plain=s.get_text(' ',strip=True)
                  m=re.search(r'((?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2}\s+2026)',plain)
                  if m:dt=datetime.strptime(m.group(1),'%B %d %Y').date().isoformat()
                return {'title':title,'authors':authors,'doi':doi,'acl_bib_url':url,'url':landing,'publication_date':dt,'publication_date_precision':'DAY' if dt else None}
              except Exception as e:return {'bib_url':url,'error':repr(e)}
            with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              rows=list(ex.map(tacl_one,bib_links))
            tacl['audited_candidates']=rows; tacl['items']=[x for x in rows if in_window(x.get('publication_date'))]
          except Exception as e:tacl['errors'].append(repr(e))
          tacl['count']=len(tacl['items']); result['tacl']=tacl

          Path('probe/remaining-first-party.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          compact={k:{'count':v.get('count'),'errors':v.get('errors'),'candidate_count':v.get('candidate_count') or v.get('august_candidates'),'items':v.get('items')} for k,v in result.items()}
          Path('probe/remaining-first-party-summary.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:{'count':v.get('count'),'errors':v.get('errors'),'candidate_count':v.get('candidate_count') or v.get('august_candidates')} for k,v in result.items()},ensure_ascii=False,indent=2))
          PY
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- probe/remaining-first-party.json probe/remaining-first-party-summary.json
          git commit -m 'probe: verify remaining first-party August publication dates'
          git pull --rebase origin data/2026-08-finish-remaining
          git push
