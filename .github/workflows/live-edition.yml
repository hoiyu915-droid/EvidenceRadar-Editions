name: Build and publish a live scoped edition

on:
  workflow_dispatch:
    inputs:
      journal_slug:
        description: Registered journal slug from catalog/journals.json
        required: true
        default: jama-network-open
      start:
        description: Inclusive publication start date (YYYY-MM-DD)
        required: true
      end:
        description: Inclusive publication end date (YYYY-MM-DD)
        required: true
      period_kind:
        description: auto, day, week, month or range
        required: true
        default: auto
      revision:
        description: Positive archive revision number
        required: true
        default: "1"
      max_records:
        description: Optional explicit per-source budget; policy still clamps it unless override is enabled
        required: false
        default: ""
      sources:
        description: Optional comma-separated source lanes; blank uses registry defaults
        required: false
        default: ""
      allow_planned:
        description: Allow a registry entry with enabled=false
        required: true
        type: boolean
        default: false
      override_processing_policy:
        description: Explicitly bypass SUSPENDED mode and source-record caps; recorded in provenance
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "catalog/live-edition-request.json"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: evidenceradar-live-edition-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Editions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve live Edition request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_JOURNAL_SLUG: ${{ inputs.journal_slug }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_PERIOD_KIND: ${{ inputs.period_kind }}
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_MAX_RECORDS: ${{ inputs.max_records }}
          INPUT_SOURCES: ${{ inputs.sources }}
          INPUT_ALLOW_PLANNED: ${{ inputs.allow_planned }}
          INPUT_POLICY_OVERRIDE: ${{ inputs.override_processing_policy }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date
          from pathlib import Path

          def text(value):
              return str(value or "").strip()

          def truth(value):
              return text(value).casefold() in {"1", "true", "yes", "on"}

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              req = {
                  "request_id": f"workflow-dispatch-{os.environ.get('GITHUB_RUN_ID', '')}",
                  "journal_slug": text(os.environ.get("INPUT_JOURNAL_SLUG")),
                  "start": text(os.environ.get("INPUT_START")),
                  "end": text(os.environ.get("INPUT_END")),
                  "period_kind": text(os.environ.get("INPUT_PERIOD_KIND")) or "auto",
                  "revision": int(text(os.environ.get("INPUT_REVISION")) or "1"),
                  "max_records": text(os.environ.get("INPUT_MAX_RECORDS")),
                  "sources": text(os.environ.get("INPUT_SOURCES")),
                  "allow_planned": truth(os.environ.get("INPUT_ALLOW_PLANNED")),
                  "override_processing_policy": truth(os.environ.get("INPUT_POLICY_OVERRIDE")),
              }
          else:
              path = Path("catalog/live-edition-request.json")
              req = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(req, dict):
                  raise SystemExit("live-edition request must be a JSON object")

          for key in ("journal_slug", "start", "end"):
              if not text(req.get(key)):
                  raise SystemExit(f"missing live-edition request field: {key}")
          start = date.fromisoformat(text(req["start"]))
          end = date.fromisoformat(text(req["end"]))
          if start > end:
              raise SystemExit("live-edition start must not be after end")
          period_kind = text(req.get("period_kind")) or "auto"
          if period_kind not in {"auto", "day", "week", "month", "range"}:
              raise SystemExit("invalid live-edition period_kind")
          revision = int(req.get("revision") or 1)
          if revision < 1:
              raise SystemExit("live-edition revision must be positive")
          max_records = text(req.get("max_records"))
          if max_records and int(max_records) < 1:
              raise SystemExit("max_records must be positive when set")
          values = {
              "request_id": text(req.get("request_id")) or f"request-{os.environ.get('GITHUB_RUN_ID', '')}",
              "journal_slug": text(req["journal_slug"]),
              "start": start.isoformat(),
              "end": end.isoformat(),
              "period_kind": period_kind,
              "revision": str(revision),
              "max_records": max_records,
              "sources": text(req.get("sources")),
              "allow_planned": "true" if bool(req.get("allow_planned")) else "false",
              "override_processing_policy": "true" if bool(req.get("override_processing_policy")) else "false",
          }
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"unsafe newline in request field: {key}")
                  handle.write(f"{key}={value}\n")
          print(json.dumps(values, sort_keys=True))
          PY

      - name: Checkout pinned EvidenceRadar source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hoiyu915-droid/EvidenceRadar
          ref: 6da659df845e4b76072dae016120ca76ed9c27c4
          path: _upstream/EvidenceRadar

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install and validate repository
        run: |
          python -m pip install -e .
          python -m compileall -q evidenceradar_editions tests
          python -m unittest discover -s tests -v

      - name: Build policy-aware edition and optional translation handoff
        id: build
        env:
          EDITION_JOURNAL_SLUG: ${{ steps.request.outputs.journal_slug }}
          EDITION_START: ${{ steps.request.outputs.start }}
          EDITION_END: ${{ steps.request.outputs.end }}
          EDITION_PERIOD_KIND: ${{ steps.request.outputs.period_kind }}
          EDITION_REVISION: ${{ steps.request.outputs.revision }}
          EDITION_MAX_RECORDS: ${{ steps.request.outputs.max_records }}
          EDITION_SOURCES: ${{ steps.request.outputs.sources }}
          EDITION_ALLOW_PLANNED: ${{ steps.request.outputs.allow_planned }}
          EDITION_POLICY_OVERRIDE: ${{ steps.request.outputs.override_processing_policy }}
          EDITION_CATALOG_ROOT: catalog
          EDITION_OUTPUT_DIR: dist/edition
        run: python -m evidenceradar_editions.workflow

      - name: Validate acquisition bundle
        run: python -m evidenceradar_editions validate --bundle-dir dist/edition

      - name: Publish into canonical editions store
        id: publish
        run: |
          set -euo pipefail
          result="$(python -m evidenceradar_editions publish \
            --bundle-dir dist/edition \
            --editions-root editions \
            --allow-untranslated)"
          echo "$result"
          published="$(python -c 'import json,sys; print(json.load(sys.stdin)["published"])' <<<"$result")"
          repo_root="$(pwd)"
          case "$published" in
            "$repo_root"/editions/*) target="${published#$repo_root/}" ;;
            *) echo "Unexpected canonical publication path: $published" >&2; exit 1 ;;
          esac
          python - "$target" <<'PY'
          import sys
          from pathlib import Path
          from evidenceradar_editions.store_v3 import validate_stored_publication
          errors = validate_stored_publication(Path(sys.argv[1]), require_zh_tw=False)
          if errors:
              raise SystemExit("\n".join(errors))
          PY
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain -- "$target")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit canonical publication branch
        id: commit
        if: steps.publish.outputs.changed == 'true'
        env:
          TARGET: ${{ steps.publish.outputs.target }}
          JOURNAL_SLUG: ${{ steps.request.outputs.journal_slug }}
          START: ${{ steps.request.outputs.start }}
          END: ${{ steps.request.outputs.end }}
          REVISION: ${{ steps.request.outputs.revision }}
        run: |
          set -euo pipefail
          original_main="$(git rev-parse HEAD)"
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$original_main" != "$current_main" ]; then
            echo "main moved during live-edition acquisition; refusing stale publication" >&2
            exit 1
          fi
          safe_slug="$(printf '%s' "$JOURNAL_SLUG" | tr -cd 'a-zA-Z0-9-')"
          branch="automation/live-edition-${safe_slug}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          while IFS= read -r path; do
            case "$path" in
              "$TARGET"/*) ;;
              *) echo "Refusing unrelated staged path: $path" >&2; exit 1 ;;
            esac
          done <<< "$staged"
          git commit -m "Publish ${JOURNAL_SLUG} ${START}–${END} r${REVISION}"
          head_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$original_main" >> "$GITHUB_OUTPUT"

      - name: Publish canonical commit through guarded PR or fast-forward fallback
        id: merge
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          BASE_SHA: ${{ steps.commit.outputs.base_sha }}
          TARGET: ${{ steps.publish.outputs.target }}
          JOURNAL_SLUG: ${{ steps.request.outputs.journal_slug }}
          START: ${{ steps.request.outputs.start }}
          END: ${{ steps.request.outputs.end }}
          REVISION: ${{ steps.request.outputs.revision }}
        run: |
          set -euo pipefail
          pr_err="$RUNNER_TEMP/live-edition-pr.err"
          set +e
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Publish ${JOURNAL_SLUG} ${START}–${END} r${REVISION}" \
            --body "Automated canonical publication from live-edition workflow run ${GITHUB_RUN_ID}. Repository tests, bundle validation, canonical-store validation, and stale-main protection completed before this PR. Generated path: \`${TARGET}\`." 2>"$pr_err")"
          pr_status=$?
          set -e

          if [ "$pr_status" -eq 0 ]; then
            pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
            merge_json="$(gh api \
              --method PUT \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number/merge" \
              -f merge_method=squash \
              -f sha="$HEAD_SHA" \
              -f commit_title="Publish ${JOURNAL_SLUG} ${START}–${END} r${REVISION}")"
            merged="$(python -c 'import json,sys; print(str(json.load(sys.stdin).get("merged", False)).lower())' <<<"$merge_json")"
            merge_sha="$(python -c 'import json,sys; print(json.load(sys.stdin).get("sha", ""))' <<<"$merge_json")"
            if [ "$merged" != "true" ] || [ -z "$merge_sha" ]; then
              echo "$merge_json" >&2
              exit 1
            fi
            mode="PULL_REQUEST_SQUASH"
          elif grep -Eqi 'not permitted to create|pull requests.*disabled|resource not accessible' "$pr_err"; then
            cat "$pr_err" >&2
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$BASE_SHA"
            git push origin "$HEAD_SHA:refs/heads/main"
            merge_sha="$HEAD_SHA"
            pr_url="action-token-pr-disabled; guarded fast-forward used"
            mode="DIRECT_FAST_FORWARD_FALLBACK"
          else
            cat "$pr_err" >&2
            exit "$pr_status"
          fi

          git push origin --delete "$BRANCH" || true
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "publication_mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Resolve canonical main SHA for idempotent publication
        id: unchanged
        if: steps.publish.outputs.changed != 'true'
        run: |
          git fetch origin main
          echo "merge_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "pr_url=idempotent-no-new-pr" >> "$GITHUB_OUTPUT"
          echo "publication_mode=IDEMPOTENT_ALREADY_PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Dispatch complete default Edition pipeline
        id: downstream
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha || steps.unchanged.outputs.merge_sha }}
        run: |
          set -euo pipefail
          test -n "$MERGE_SHA"
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -f ref=main

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow pages.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$MERGE_SHA\") | .databaseId" \
              | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "Could not resolve dispatched Pages run for $MERGE_SHA" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Write end-to-end publication summary
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          MODE_CONFIGURED: ${{ steps.build.outputs.processing_mode_configured }}
          MODE_EFFECTIVE: ${{ steps.build.outputs.processing_mode_effective }}
          ARTICLE_COUNT: ${{ steps.build.outputs.article_count }}
          SOURCE_LIMIT: ${{ steps.build.outputs.source_record_limit }}
          PAGES_LIMIT: ${{ steps.build.outputs.pages_record_limit }}
          TRANSLATION_MODE: ${{ steps.build.outputs.translation_mode }}
          TRANSLATION_REQUEST: ${{ steps.build.outputs.translation_request_json }}
          POLICY_OVERRIDE: ${{ steps.build.outputs.policy_override_used }}
          PUBLISHED_TARGET: ${{ steps.publish.outputs.target }}
          PUBLISH_CHANGED: ${{ steps.publish.outputs.changed }}
          PR_URL: ${{ steps.merge.outputs.pr_url || steps.unchanged.outputs.pr_url }}
          PUBLICATION_MODE: ${{ steps.merge.outputs.publication_mode || steps.unchanged.outputs.publication_mode }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha || steps.unchanged.outputs.merge_sha }}
          DOWNSTREAM_RUN_ID: ${{ steps.downstream.outputs.run_id }}
        run: |
          {
            echo "## EvidenceRadar Editions end-to-end publication"
            echo
            echo "- request id: \`${REQUEST_ID}\`"
            echo "- configured mode: \`${MODE_CONFIGURED}\`"
            echo "- effective mode: \`${MODE_EFFECTIVE}\`"
            echo "- canonical metadata records: \`${ARTICLE_COUNT}\`"
            echo "- applied per-source limit: \`${SOURCE_LIMIT}\`"
            echo "- Pages record limit: \`${PAGES_LIMIT}\`"
            echo "- translation mode: \`${TRANSLATION_MODE}\`"
            echo "- translation request: \`${TRANSLATION_REQUEST:-deferred}\`"
            echo "- policy override used: \`${POLICY_OVERRIDE}\`"
            echo "- canonical target: \`${PUBLISHED_TARGET}\`"
            echo "- canonical bytes changed: \`${PUBLISH_CHANGED}\`"
            echo "- publication mode: \`${PUBLICATION_MODE}\`"
            echo "- publication PR: ${PR_URL}"
            echo "- canonical main SHA: \`${MERGE_SHA}\`"
            echo "- complete Pages/evidence run: \`${DOWNSTREAM_RUN_ID}\`"
            echo "- terminal contract: live acquisition → canonical publication → guarded publication → default abstract/full-text/evidence/editorial pipeline → Pages"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated edition and any TranslationRequest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EvidenceRadar-Editions__${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.bundle_dir }}/
          if-no-files-found: error
          retention-days: 30
