name: Probe RSC first-party article landings

on:
  push:
    branches: [fix/chemical-science-first-party]
    paths: [.github/workflows/probe-rsc-landing.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Snapshot and validate Chemical Science candidates
        run: |
          python -m pip install 'requests>=2.32,<3'
          python - <<'PY'
          import collections
          import json
          from pathlib import Path
          import requests

          ISSN = "2041-6539"
          s = requests.Session()
          s.headers.update({"User-Agent": "EvidenceRadar-Editions/0.2 chemical-science-snapshot (mailto:noreply@example.com)"})
          params = {
              "filter": "from-created-date:2026-08-01,until-created-date:2026-08-14,issn:" + ISSN + ",type:journal-article",
              "query.container-title": "Chemical Science",
              "rows": 1000,
              "select": "DOI,title,container-title,created,URL,ISSN,author,type,publisher,prefix",
          }
          r = s.get("https://api.crossref.org/works", params=params, timeout=60)
          r.raise_for_status()
          message = r.json()["message"]
          items = message.get("items") or []

          def first(value):
              return value[0] if isinstance(value, list) and value else value

          cleaned = []
          for raw in items:
              created_parts = ((raw.get("created") or {}).get("date-parts") or [[]])[0]
              created = None
              if len(created_parts) >= 3:
                  created = f"{created_parts[0]:04d}-{created_parts[1]:02d}-{created_parts[2]:02d}"
              cleaned.append({
                  "DOI": raw.get("DOI"),
                  "title": first(raw.get("title")),
                  "container-title": first(raw.get("container-title")),
                  "created": created,
                  "URL": raw.get("URL"),
                  "ISSN": raw.get("ISSN") or [],
                  "author": raw.get("author") or [],
                  "type": raw.get("type"),
                  "publisher": raw.get("publisher"),
                  "prefix": raw.get("prefix"),
              })
          cleaned.sort(key=lambda x: (x.get("created") or "", (x.get("DOI") or "").casefold()))

          exact_journal = [x for x in cleaned if str(x.get("container-title") or "").casefold() == "chemical science"]
          exact_issn = [x for x in cleaned if ISSN in (x.get("ISSN") or [])]
          rsc_prefix = [x for x in cleaned if str(x.get("DOI") or "").lower().startswith("10.1039/")]
          full_day = [x for x in cleaned if x.get("created")]
          publishers = collections.Counter(str(x.get("publisher")) for x in cleaned)
          types = collections.Counter(str(x.get("type")) for x in cleaned)
          dates = collections.Counter(str(x.get("created")) for x in cleaned)
          summary = {
              "crossref_total_results": message.get("total-results"),
              "returned": len(cleaned),
              "exact_journal": len(exact_journal),
              "exact_issn": len(exact_issn),
              "rsc_doi_prefix": len(rsc_prefix),
              "full_created_day": len(full_day),
              "missing_title": sum(not x.get("title") for x in cleaned),
              "publisher_counts": dict(sorted(publishers.items())),
              "type_counts": dict(sorted(types.items())),
              "created_date_counts": dict(sorted(dates.items())),
          }
          payload = {
              "artifact_type": "ChemicalScienceCreatedDateCandidateSnapshot",
              "window": {"start": "2026-08-01", "end": "2026-08-14"},
              "journal": "Chemical Science",
              "issn": ISSN,
              "query_semantics": "Crossref created-date candidates only; not generic publication-date evidence",
              "summary": summary,
              "items": cleaned,
          }
          Path("probe").mkdir(exist_ok=True)
          Path("probe/chemical-science-candidates.json").write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          assert len(cleaned) == message.get("total-results")
          assert len(exact_journal) == len(cleaned)
          assert len(exact_issn) == len(cleaned)
          assert len(rsc_prefix) == len(cleaned)
          assert len(full_day) == len(cleaned)
          assert not summary["missing_title"]
          PY
      - name: Commit snapshot to probe branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe/chemical-science-candidates.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: snapshot Chemical Science August candidates'
          git push origin HEAD:fix/chemical-science-first-party
