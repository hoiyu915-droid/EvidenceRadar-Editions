name: Probe RSC first-party article landings

on:
  push:
    branches: [fix/chemical-science-first-party]
    paths: [.github/workflows/probe-rsc-landing.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Snapshot compact Chemical Science candidates
        run: |
          python -m pip install 'requests>=2.32,<3'
          python - <<'PY'
          import collections
          import html
          import json
          import re
          from pathlib import Path
          import requests

          ISSN = "2041-6539"
          s = requests.Session()
          s.headers.update({"User-Agent": "EvidenceRadar-Editions/0.2 chemical-science-snapshot (mailto:noreply@example.com)"})
          params = {
              "filter": "from-created-date:2026-08-01,until-created-date:2026-08-14,issn:" + ISSN + ",type:journal-article",
              "query.container-title": "Chemical Science",
              "rows": 1000,
              "select": "DOI,title,container-title,created,URL,ISSN,author,type,publisher,prefix",
          }
          r = s.get("https://api.crossref.org/works", params=params, timeout=60)
          r.raise_for_status()
          message = r.json()["message"]
          items = message.get("items") or []

          def clean(value):
              text = html.unescape(str(value or ""))
              text = re.sub(r"<[^>]+>", "", text)
              return re.sub(r"\s+", " ", text).strip()

          rows = []
          for raw in items:
              created_parts = ((raw.get("created") or {}).get("date-parts") or [[]])[0]
              created = f"{created_parts[0]:04d}-{created_parts[1]:02d}-{created_parts[2]:02d}" if len(created_parts) >= 3 else None
              title_raw = (raw.get("title") or [""])[0]
              authors = []
              for person in raw.get("author") or []:
                  name = clean(" ".join(str(person.get(k) or "").strip() for k in ("given", "family")))
                  if name:
                      authors.append(name)
              rows.append({
                  "doi": str(raw.get("DOI") or "").lower(),
                  "title": clean(title_raw),
                  "created": created,
                  "url": raw.get("URL"),
                  "issn": raw.get("ISSN") or [],
                  "authors": authors,
                  "container_title": clean((raw.get("container-title") or [""])[0]),
                  "publisher": clean(raw.get("publisher")),
                  "prefix": str(raw.get("prefix") or ""),
                  "type": str(raw.get("type") or ""),
              })
          rows.sort(key=lambda x: (x["created"] or "", x["doi"]))
          assert len(rows) == int(message.get("total-results")) == 83
          assert all(x["container_title"].casefold() == "chemical science" for x in rows)
          assert all(ISSN in x["issn"] for x in rows)
          assert all(x["doi"].startswith("10.1039/") for x in rows)
          assert all(x["publisher"] == "Royal Society of Chemistry (RSC)" for x in rows)
          assert all(x["type"] == "journal-article" for x in rows)
          assert all(x["created"] and x["title"] for x in rows)
          Path("probe").mkdir(exist_ok=True)
          Path("probe/chemical-science-candidates-compact.jsonl").write_text(
              "".join(json.dumps(row, ensure_ascii=False, separators=(",", ":")) + "\n" for row in rows),
              encoding="utf-8",
          )
          print(json.dumps({
              "count": len(rows),
              "dates": dict(sorted(collections.Counter(x["created"] for x in rows).items())),
              "all_exact_journal_issn_publisher_prefix_type": True,
          }, indent=2))
          PY
      - name: Commit compact snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- probe/chemical-science-candidates-compact.jsonl
          git diff --cached --quiet && exit 0
          git commit -m 'data: add compact Chemical Science candidate snapshot'
          git push origin HEAD:fix/chemical-science-first-party
