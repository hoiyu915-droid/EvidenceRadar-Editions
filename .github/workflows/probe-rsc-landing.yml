name: Prepare Chemical Science translation input

on:
  push:
    branches: [fix/chemical-science-first-party]
    paths: [.github/workflows/probe-rsc-landing.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Emit compact translation input
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path('probe/chemical-science-live-untranslated.json').read_text(encoding='utf-8'))
          rows = []
          for article in run['articles']:
              rows.append({
                  'canonical_id': article['canonical_id'],
                  'doi': article['doi'],
                  'publication_date': article['publication_date'],
                  'article_type': article['article_type'],
                  'title': article['title_original'],
              })
          rows.sort(key=lambda x: (x['publication_date'], x['doi']))
          assert len(rows) == 76
          Path('probe/chemical-science-translation-input.jsonl').write_text(
              ''.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n' for row in rows),
              encoding='utf-8',
          )
          print(json.dumps({'count': len(rows), 'first': rows[0], 'last': rows[-1]}, ensure_ascii=False, indent=2))
          PY
      - name: Commit translation input
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- probe/chemical-science-translation-input.jsonl
          git diff --cached --quiet && exit 0
          git commit -m 'data: prepare Chemical Science translation input'
          git push origin HEAD:fix/chemical-science-first-party
