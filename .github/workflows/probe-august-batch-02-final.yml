name: Probe August 2026 batch 02 replacements

on:
  push:
    branches:
      - data/2026-08-batch-02-final-five
    paths:
      - ".github/workflows/probe-august-batch-02-final.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Acquire replacements
        shell: bash
        run: |
          set -euo pipefail
          rm -rf probe-final
          for slug in nutrition the-lancet-global-health; do
            python -m evidenceradar_editions run \
              --journal-slug "$slug" \
              --start 2026-08-01 \
              --end 2026-08-14 \
              --period-kind month \
              --revision 1 \
              --max-records 1000 \
              --output-dir "probe-final/$slug"
          done
      - name: Audit and summarize
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          bad_re=re.compile(r'(?i)\b(editorial board|table of contents|contents|temporary removal|membership applic|current events|front matter|masthead)\b')
          summary=[]; titles=[]; flags=[]
          for d in sorted(Path('probe-final').iterdir()):
              files=[p for p in d.glob('*.json') if not p.name.endswith('.manifest.json') and 'translation-' not in p.name]
              if len(files)!=1: raise SystemExit(f'{d}: edition JSON count={len(files)}')
              run=json.loads(files[0].read_text(encoding='utf-8'))
              articles=[a for a in run.get('articles') or [] if isinstance(a,dict)]
              for a in articles:
                  row={'slug':d.name,'canonical_id':a.get('canonical_id'),'title':a.get('title_original') or a.get('title'),'date':a.get('publication_date'),'date_precision':a.get('publication_date_precision'),'article_type':a.get('article_type'),'doi':a.get('doi'),'pmid':a.get('pmid')}
                  titles.append(row)
                  precision=str(row['date_precision'] or '').upper(); value=str(row['date'] or '')
                  date_ok=(precision=='DAY' and '2026-08-01' <= value <= '2026-08-14') or (precision=='MONTH' and value.startswith('2026-08'))
                  if (not date_ok) or bad_re.search(str(row['title'] or '')):
                      flags.append({**row,'date_ok':date_ok,'keyword_flag':bool(bad_re.search(str(row['title'] or '')))})
              summary.append({'slug':d.name,'articles':len(articles),'run_status':run.get('run_status'),'source_checks':run.get('source_checks')})
          Path('probe-final/summary.json').write_text(json.dumps({'period':'2026-08','through':'2026-08-14','journals':summary,'flag_count':len(flags)},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open('probe-final/titles.ndjson','w',encoding='utf-8') as f:
              for row in titles: f.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
          Path('probe-final/flags.json').write_text(json.dumps({'count':len(flags),'items':flags},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2)); print('flags',len(flags))
          PY
      - name: Commit probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- probe-final
          git diff --cached --check
          git commit -m 'probe: acquire August batch 02 replacement journals'
          git push origin HEAD:data/2026-08-batch-02-final-five
