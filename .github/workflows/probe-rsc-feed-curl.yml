name: Retry Chemical Science official feed with curl
on:
  push:
    branches: [data/2026-08-finish-remaining]
    paths: [.github/workflows/probe-rsc-feed-curl.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Fetch official RSS
        run: |
          set -euxo pipefail
          curl --http1.1 -k -L --retry 5 --retry-all-errors --connect-timeout 20 --max-time 90 \
            -A 'EvidenceRadar-Editions/0.2 final-rsc-probe' \
            'https://feeds.rsc.org/rss/sc' -o /tmp/sc.xml
          test -s /tmp/sc.xml
          python - <<'PY'
          import email.utils,html,json,re,xml.etree.ElementTree as ET
          from datetime import date
          from pathlib import Path
          from bs4 import BeautifulSoup
          start=date(2026,8,1);end=date(2026,8,14)
          raw=Path('/tmp/sc.xml').read_bytes();root=ET.fromstring(raw);items=[]
          def clean(s):return re.sub(r'\s+',' ',BeautifulSoup(html.unescape(str(s or '')),'html.parser').get_text(' ',strip=True)).strip()
          for it in root.findall('.//item'):
            val=lambda tag:(it.findtext(tag) or '').strip();rd=val('pubDate');dt=None
            try:dt=email.utils.parsedate_to_datetime(rd).date()
            except:pass
            if not dt or not(start<=dt<=end):continue
            title=clean(val('title'));desc=clean(val('description'));link=val('link');m=re.search(r'10\.1039/[A-Za-z0-9.()/_:-]+',desc+' '+link,re.I);doi=m.group(0).rstrip('.,)').lower() if m else None
            items.append({'title':title,'authors':[],'doi':doi,'url':link,'publication_date':dt.isoformat(),'publication_date_precision':'DAY','description':desc,'date_evidence':'official Chemical Science RSS pubDate'})
          payload={'source':'https://feeds.rsc.org/rss/sc','count':len(items),'items':items}
          Path('probe/chemical-science-official-rss.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'count':len(items),'first':items[:3],'last':items[-3:]},ensure_ascii=False,indent=2))
          PY
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- probe/chemical-science-official-rss.json
          git commit -m 'probe: verify Chemical Science August RSS dates'
          git pull --rebase origin data/2026-08-finish-remaining
          git push
