name: QA remaining TMLR translation
on:
  push:
    branches: [data/2026-08-finish-remaining]
    paths: [.github/workflows/qa-tmlr-translation.yml]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Normalize encoding and high-confidence terminology
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('translation-work/remaining/tmlr.json'); data=json.loads(p.read_text()); changed=[]
          def fix_utf8(s):
            s=str(s or '')
            if any(x in s for x in ('Ã','â','Â','ð')):
              try:return s.encode('latin1').decode('utf-8')
              except (UnicodeEncodeError,UnicodeDecodeError):return s
            return s
          for row in data['items']:
            before=json.dumps(row,ensure_ascii=False,sort_keys=True)
            for k in ('title','title_original'):
              if k in row:row[k]=fix_utf8(row[k])
            row['authors']=[fix_utf8(x) for x in row.get('authors') or []]
            if row.get('authors') and row['authors'][0].startswith(row['title_original']+' '):
              row['authors'][0]=row['authors'][0][len(row['title_original']):].strip()
            if re.search(r'\bLLMs?\b',row['title_original'],re.I):
              row['title_zh_tw']=row['title_zh_tw'].replace('法學碩士們','LLMs').replace('法學碩士','LLM')
            after=json.dumps(row,ensure_ascii=False,sort_keys=True)
            if before!=after:changed.append({'canonical_id':row['canonical_id'],'title_original':row['title_original'],'title_zh_tw':row['title_zh_tw'],'authors':row.get('authors')})
          bad=[]
          for row in data['items']:
            blob=' '.join([row.get('title_original',''),row.get('title_zh_tw',''),*row.get('authors',[])])
            reasons=[]
            if any(x in blob for x in ('Ã','â','Â','法學碩士')):reasons.append('encoding_or_llm_mistranslation')
            if row.get('authors') and row['authors'][0].startswith(row['title_original']):reasons.append('title_leaked_into_author')
            if reasons:bad.append({'canonical_id':row['canonical_id'],'reasons':reasons,'blob':blob})
          assert len(data['items'])==84 and not bad,bad[:5]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          q=Path('translation-work/remaining/tmlr-qa.json');q.write_text(json.dumps({'changed_count':len(changed),'changes':changed,'remaining_issues':bad},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'changed_count':len(changed),'remaining_issues':len(bad),'sample':changed[:10]},ensure_ascii=False,indent=2))
          PY
      - name: Commit QA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- translation-work/remaining/tmlr.json translation-work/remaining/tmlr-qa.json
          git commit -m 'translation: normalize TMLR zh-TW candidate ledger'
          git pull --rebase origin data/2026-08-finish-remaining
          git push
