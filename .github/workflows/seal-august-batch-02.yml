name: Seal August 2026 batch 02 canonical editions

on:
  push:
    branches:
      - data/2026-08-batch-02-five-journals
    paths:
      - ".github/workflows/seal-august-batch-02.yml"

permissions:
  contents: write

concurrency:
  group: seal-august-2026-batch-02
  cancel-in-progress: false

# Retry 3: count canonical targets regardless of Git rename detection.
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out batch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install current Editions engine
        run: python -m pip install -e .
      - name: Seal five validated August MTD editions
        run: python tools/seal_august_batch02.py
      - name: Commit canonical data only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -r --ignore-unmatch -- probe translation-work
          git rm --ignore-unmatch -- \
            .github/workflows/probe-august-batch-02.yml \
            .github/workflows/extract-august-batch-02-titles.yml \
            .github/workflows/seal-august-batch-02.yml \
            tools/seal_august_batch02.py

          git add -- \
            editions/clinical-nutrition/2026/08/r01 \
            editions/computers-in-human-behavior/2026/08/r01 \
            editions/journal-of-science-and-medicine-in-sport/2026/08/r01 \
            editions/neural-networks/2026/08/r01 \
            editions/the-lancet/2026/08/r01

          if find editions -type f \( -name '*.html' -o -name '*.zip' \) -print -quit | grep -q .; then
            echo '::error::presentation artifact leaked into canonical editions tree'
            exit 1
          fi

          git diff --cached --check
          canonical=$(git diff --cached --name-only --diff-filter=ACMR | grep -E '^editions/(clinical-nutrition|computers-in-human-behavior|journal-of-science-and-medicine-in-sport|neural-networks|the-lancet)/2026/08/r01/(edition|manifest|storage)\.json$' | wc -l | tr -d ' ')
          if [ "$canonical" != "15" ]; then
            echo "::error::expected exactly 15 canonical target files, got $canonical"
            git status --short
            exit 1
          fi
          bad=$(git diff --cached --name-only --diff-filter=ACMR | grep -Ev '^editions/(clinical-nutrition|computers-in-human-behavior|journal-of-science-and-medicine-in-sport|neural-networks|the-lancet)/2026/08/r01/(edition|manifest|storage)\.json$' || true)
          if [ -n "$bad" ]; then
            echo '::error::unexpected non-deletion paths are staged'
            printf '%s\n' "$bad"
            exit 1
          fi
          git status --short
          git commit -m 'data: publish August 2026 batch 02 editions'
          git push origin HEAD:data/2026-08-batch-02-five-journals
