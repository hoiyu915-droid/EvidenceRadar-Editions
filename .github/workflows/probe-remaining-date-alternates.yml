name: Probe alternate August dates for remaining journals
on:
  push:
    branches: [data/2026-08-finish-remaining]
    paths: [.github/workflows/probe-remaining-date-alternates.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Probe Crossref online-published and DOI date blocks
        run: |
          python - <<'PY'
          import json,time
          from pathlib import Path
          import requests

          S=requests.Session(); S.headers.update({'User-Agent':'EvidenceRadar-Editions/0.2 remaining-date-probe'})
          journals=[
            ('Chemical Science','2041-6539'),('Chemical Science','2041-6520'),
            ('Information Processing & Management','0306-4573'),
            ('Journal of Machine Learning Research','1533-7928'),
            ('Journal of Machine Learning Research','1532-4435'),
            ('Journal of Sport and Health Science','2095-2546'),
            ('Natural Language Processing Journal','2949-7191'),
            ('Psychology of Sport and Exercise','1469-0292'),
            ('Transactions of the Association for Computational Linguistics','2307-387X'),
          ]
          out=[]
          for name,issn in journals:
            rec={'journal':name,'issn':issn,'queries':{}}
            for kind,filters in {
              'pub':f'from-pub-date:2026-08-01,until-pub-date:2026-08-14,type:journal-article,issn:{issn}',
              'online':f'from-online-pub-date:2026-08-01,until-online-pub-date:2026-08-14,type:journal-article,issn:{issn}',
              'created':f'from-created-date:2026-08-01,until-created-date:2026-08-14,type:journal-article,issn:{issn}',
            }.items():
              try:
                r=S.get('https://api.crossref.org/works',params={'filter':filters,'rows':1000,'select':'DOI,title,container-title,ISSN,published-online,published-print,published,issued,created,deposited,author,URL,type'},timeout=60); r.raise_for_status(); m=r.json()['message']
                rec['queries'][kind]={'total':m.get('total-results',0),'items':m.get('items') or []}
              except Exception as e: rec['queries'][kind]={'error':repr(e)}
              time.sleep(.35)
            out.append(rec)
          dois=['10.1016/j.psychsport.2026.103242','10.1016/j.psychsport.2026.103240','10.1016/j.psychsport.2026.103238']
          doi_dates=[]
          for doi in dois:
            try:
              r=S.get('https://api.crossref.org/works/'+doi,timeout=60); r.raise_for_status(); m=r.json()['message']
              doi_dates.append({'doi':doi,**{k:m.get(k) for k in ('title','container-title','published-online','published-print','published','issued','created','deposited','indexed')}})
            except Exception as e: doi_dates.append({'doi':doi,'error':repr(e)})
            time.sleep(.35)
          payload={'journals':out,'psychology_doi_dates':doi_dates}
          Path('probe/remaining-date-alternates.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps([{'journal':r['journal'],'issn':r['issn'],'totals':{k:v.get('total') for k,v in r['queries'].items()}} for r in out],ensure_ascii=False,indent=2))
          print(json.dumps(doi_dates,ensure_ascii=False,indent=2))
          PY
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- probe/remaining-date-alternates.json
          git commit -m 'probe: inspect alternate date metadata for remaining journals'
          git pull --rebase origin data/2026-08-finish-remaining
          git push
