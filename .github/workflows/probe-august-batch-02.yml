name: Probe August 2026 batch 02 journals

on:
  push:
    branches:
      - data/2026-08-batch-02-five-journals
    paths:
      - ".github/workflows/probe-august-batch-02.yml"

permissions:
  contents: write

concurrency:
  group: probe-august-2026-batch-02
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out batch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Editions
        run: python -m pip install -e .
      - name: Acquire five August MTD editions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf probe
          for slug in \
            the-lancet \
            journal-of-science-and-medicine-in-sport \
            clinical-nutrition \
            neural-networks \
            computers-in-human-behavior
          do
            python -m evidenceradar_editions run \
              --journal-slug "$slug" \
              --start 2026-08-01 \
              --end 2026-08-14 \
              --period-kind month \
              --revision 1 \
              --max-records 1000 \
              --output-dir "probe/$slug"
          done
      - name: Summarize probe
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for d in sorted(Path('probe').iterdir()):
              if not d.is_dir():
                  continue
              candidates=[p for p in d.glob('*.json') if not p.name.endswith('.manifest.json') and 'translation-' not in p.name]
              if len(candidates) != 1:
                  raise SystemExit(f'{d}: expected one edition JSON, found {candidates}')
              run=json.loads(candidates[0].read_text(encoding='utf-8'))
              rows.append({
                  'slug': d.name,
                  'journal': (run.get('scope') or {}).get('journal'),
                  'articles': (run.get('counts') or {}).get('articles'),
                  'run_status': run.get('run_status'),
                  'source_checks': run.get('source_checks'),
                  'edition_json': str(candidates[0]),
              })
          Path('probe/summary.json').write_text(json.dumps({'period':'2026-08','through':'2026-08-14','journals':rows},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Commit probe results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- probe
          git diff --cached --check
          git commit -m 'probe: acquire August 2026 batch 02'
          git push origin HEAD:data/2026-08-batch-02-five-journals
