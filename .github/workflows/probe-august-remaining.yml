name: Probe all remaining August 2026 registry journals
on:
  push:
    branches: [data/2026-08-finish-remaining]
    paths: [.github/workflows/probe-august-remaining.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Compute remaining registry and probe August window
        run: |
          python - <<'PY'
          import json,re,time
          from datetime import date
          from pathlib import Path
          import requests
          from evidenceradar_editions.engine import build_run
          from evidenceradar_editions.models import EditionSpec

          registry=json.loads(Path('catalog/journals.json').read_text())
          published={p.parts[1] for p in Path('editions').glob('*/**/edition.json') if len(p.parts)>1}
          remaining=[j for j in registry['journals'] if j['slug'] not in published]
          front=re.compile(r'^(?:editorial board|editorial office|table of contents|contents|front cover|back cover|call for papers|temporary removal|withdrawn|current events|preface(?:\s+to)?|.*membership applic|.*award(?:\s|$))',re.I)
          outroot=Path('probe/remaining-august'); outroot.mkdir(parents=True,exist_ok=True)
          summary=[]
          for j in remaining:
            row={k:j.get(k) for k in ('name','slug','status','issn','publisher','oa','sources')}
            issn=j.get('issn'); sources=tuple(j.get('sources') or ())
            if issn and sources:
              try:
                ed=build_run(EditionSpec(journal=j['name'],issn=issn,slug=j['slug'],start_date=date(2026,8,1),end_date=date(2026,8,14),sources=sources,max_records=5000,period_kind='month'))
                flags=[]
                for a in ed.get('articles') or []:
                  reasons=[]
                  if a.get('publication_date_precision')=='YEAR': reasons.append('YEAR')
                  if front.search((a.get('title') or '').strip()): reasons.append('FRONT_MATTER')
                  if reasons: flags.append({'canonical_id':a['canonical_id'],'title':a.get('title'),'date':a.get('publication_date'),'precision':a.get('publication_date_precision'),'reason':reasons})
                d=outroot/j['slug']; d.mkdir(parents=True,exist_ok=True)
                (d/'edition.json').write_text(json.dumps(ed,ensure_ascii=False,indent=2)+'\n')
                row.update({'probe_mode':'registry_exact','articles':ed['counts']['articles'],'flag_count':len(flags),'rough_keepable':ed['counts']['articles']-len(flags),'flags':flags,'run_status':ed['run_status'],'source_checks':ed['source_checks']})
              except Exception as exc:
                row.update({'probe_mode':'registry_exact','probe_error':repr(exc)})
            else:
              params={'query.container-title':j['name'],'filter':'from-pub-date:2026-08-01,until-pub-date:2026-08-14,type:journal-article','rows':1000,'select':'DOI,title,container-title,ISSN,published,published-online,published-print,type'}
              try:
                r=requests.get('https://api.crossref.org/works',params=params,headers={'User-Agent':'EvidenceRadar-Editions/0.2 remaining-probe'},timeout=60)
                r.raise_for_status(); msg=r.json()['message']; items=msg.get('items') or []
                candidates={}
                for item in items:
                  containers=item.get('container-title') or []
                  if not any(str(x).casefold()==j['name'].casefold() for x in containers):
                    continue
                  for value in item.get('ISSN') or []: candidates[value]=candidates.get(value,0)+1
                row.update({'probe_mode':'crossref_discovery','crossref_total_results':msg.get('total-results',0),'exact_container_items':sum(candidates.values()) if candidates else 0,'issn_candidates':dict(sorted(candidates.items(),key=lambda kv:(-kv[1],kv[0]))[:10])})
              except Exception as exc:
                row.update({'probe_mode':'crossref_discovery','probe_error':repr(exc)})
            summary.append(row); time.sleep(0.15)
          payload={'period':'2026-08','through':'2026-08-14','registry_count':len(registry['journals']),'published_slug_count':len(published),'remaining_count':len(remaining),'remaining':summary}
          Path('probe/remaining-august-summary.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps([{k:r.get(k) for k in ('name','slug','status','issn','sources','probe_mode','articles','rough_keepable','run_status','crossref_total_results','issn_candidates','probe_error')} for r in summary],ensure_ascii=False,indent=2))
          PY
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- probe/remaining-august probe/remaining-august-summary.json
          git commit -m 'probe: enumerate remaining August registry journals'
          git push
